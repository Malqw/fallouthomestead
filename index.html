<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HOMESTEAD // Settlement Layout Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05100a;
    --panel:#0b1a10;
    --panel-edge:#1d3d24;
    --green:#3ce080;
    --green-dim:#1f7a45;
    --amber:#ffb454;
    --red:#ff5d5d;
    --text:#bfeccf;
    --mono:'Share Tech Mono', 'Courier New', monospace;
    --disp:'VT323', var(--mono);
  }
  *{box-sizing:border-box;}
  /* html/body pinned to exactly the viewport height (not just min-height) so .layout below is a
     properly BOUNDED flex box — otherwise the whole page grows past 100vh with enough sidebar
     content and the browser scrolls the entire page (canvas included) instead of just the
     sidebar/squad panel, which is the "поле уезжает при скролле" bug this fixes. */
  html, body{ height:100%; overflow:hidden; }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--mono);
    display:flex; flex-direction:column;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:multiply; opacity:0.35;
  }
  header{
    padding:10px 18px; border-bottom:2px solid var(--green-dim);
    display:flex; align-items:baseline; gap:16px; background:linear-gradient(180deg,#0d1f12,#081209);
    flex-wrap:wrap;
  }
  header h1{
    font-family:var(--disp); font-size:30px; letter-spacing:2px; margin:0; color:var(--green);
    text-shadow:0 0 8px rgba(60,224,128,0.5);
  }
  header .sub{ color:var(--green-dim); font-size:12px; letter-spacing:2px;}
  .layout{ display:flex; flex:1; min-height:0; }
  .sidebar{
    width:360px; flex:none; padding:14px; overflow-y:auto; border-right:2px solid var(--green-dim);
    background:var(--panel);
  }
  .stage{
    flex:1; overflow:hidden; padding:20px; display:flex; align-items:flex-start; justify-content:center;
    position:relative; touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .stage-inner{ transform-origin:0 0; will-change:transform; }
  .zoom-controls{
    position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:6px; z-index:20;
  }
  .zoom-controls button{
    width:44px; height:44px; margin:0; padding:0; font-size:22px; line-height:1;
    display:flex; align-items:center; justify-content:center; background:#0b2415e0;
  }
  fieldset{
    border:1px solid var(--green-dim); border-radius:2px; margin:0 0 14px 0; padding:10px;
  }
  legend{ font-family:var(--disp); font-size:19px; color:var(--amber); padding:0 6px; letter-spacing:1px;}
  label{ display:block; font-size:12px; margin:6px 0 3px; color:var(--green-dim); text-transform:uppercase; letter-spacing:1px;}
  input[type=text], input[type=number], select{
    width:100%; background:#03120a; border:1px solid var(--green-dim); color:var(--green);
    font-family:var(--mono); padding:5px 6px; font-size:13px; border-radius:2px;
  }
  select{ cursor:pointer; }
  input[type=checkbox]{ accent-color:var(--green); margin-right:6px; width:15px; height:15px; vertical-align:middle; }
  .row{ display:flex; gap:8px; }
  .row > div{ flex:1; }
  button{
    font-family:var(--disp); font-size:16px; letter-spacing:1px; cursor:pointer;
    background:#0b2415; border:1px solid var(--green); color:var(--green);
    padding:6px 10px; border-radius:2px; margin:4px 4px 0 0;
  }
  button:hover{ background:var(--green); color:#03120a; }
  button.danger{ border-color:var(--red); color:var(--red); }
  button.danger:hover{ background:var(--red); color:#1a0505; }
  button.ghost{ opacity:0.6; }
  button:disabled{ opacity:0.3; cursor:not-allowed; }
  button:disabled:hover{ background:#0b2415; color:var(--green); }
  .mode-btns button{ width:100%; text-align:left; margin:2px 0; }
  .mode-btns button.active{ background:var(--green); color:#03120a; }
  .hint{ font-size:11px; color:#6fae86; line-height:1.5; margin-top:6px;}
  .errbox{
    background:#2a0808; border:1px solid var(--red); color:#ffb0b0; font-size:12px;
    padding:6px 8px; margin-top:8px; border-radius:2px; white-space:pre-wrap;
  }
  .okbox{
    background:#082a12; border:1px solid var(--green); color:#c6ffdd; font-size:12px;
    padding:6px 8px; margin-top:8px; border-radius:2px;
  }
  table.log{ width:100%; border-collapse:collapse; font-size:11px; }
  table.log th, table.log td{ border:1px solid var(--green-dim); padding:3px 4px; text-align:left; }
  table.log th{ color:var(--amber); }
  table.log tr.sel{ outline:1px solid var(--amber); }
  .swatch{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle;}
  .legend-zone{ display:flex; align-items:center; gap:6px; font-size:11px; margin:2px 0; }
  .legend-zone i{ width:14px; height:14px; display:inline-block; border-radius:2px; border:1px solid #0006;}
  svg{ background:#04140b; border:1px solid var(--green-dim); }
  .cell{ cursor:pointer; }
  .cell:hover{ filter:brightness(1.3); }
  .locked{ fill:#0a0a0a !important; opacity:0.5; }
  .lbl{ font-family:var(--mono); font-weight:bold; pointer-events:none; }
  .idlbl{ font-size:9px; fill:#04140b; }
  .statlbl{ font-size:7px; fill:#ffdede; }
  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:#0b2415; border:1px solid var(--green); color:var(--green);
    padding:8px 16px; border-radius:3px; font-size:13px; z-index:400; opacity:0; transition:opacity .3s;
    pointer-events:none; max-width:92vw; text-align:center;
  }
  .toast.show{ opacity:1; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--green-dim); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:#03120a; }
  .small-note{ font-size:10px; color:#5b8f70; margin-top:2px;}
  .resource-readout{
    background:#03120a; border:1px solid var(--green-dim); color:var(--amber);
    font-family:var(--disp); font-size:18px; padding:4px 6px; border-radius:2px; text-align:center;
  }
  .armor-card{
    display:inline-block; background:#0b2415; border:1px solid var(--green-dim); border-radius:3px;
    padding:6px 8px; margin:0 6px 6px 0; font-size:11px; vertical-align:top;
  }
  .armor-name{ font-family:var(--disp); font-size:15px; letter-spacing:1px; }
  .armor-stats{ color:var(--text); margin:2px 0 6px; }
  .armor-actions{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .armor-actions button{ font-size:11px; padding:4px 6px; margin:0; }
  .armor-actions b{ cursor:pointer; color:var(--red); font-weight:normal; padding:0 4px; }
  .armor-actions b:hover{ text-decoration:underline; }

  /* ---- top-level tab switcher (Поселение / Отряд / Склад) ---- */
  .view-switch{
    display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; padding:8px 18px; background:#081209;
    border-bottom:1px solid var(--green-dim); position:relative;
  }
  .view-switch button.active{ background:var(--green); color:#03120a; }
  /* On desktop the menu is just part of the normal flex row (display:contents removes the wrapper
     from layout entirely); the mobile media query below turns it into a hamburger dropdown. */
  .view-switch-menu{ display:contents; }
  .hamburger-btn{ display:none; }
  .sidebar-toggle-btn{ display:none; }

  /* ---- Music player: small popup panel toggled from a button in the top menu, fixed-position
     so it doesn't care whether that button is currently sitting in the inline bar or the mobile
     hamburger dropdown. ---- */
  .music-panel{
    display:none; flex-direction:column; gap:10px;
    position:fixed; top:64px; right:16px; z-index:400;
    width:min(240px, calc(100vw - 32px));
    background:#0b2415; border:1px solid var(--green); border-radius:4px;
    padding:14px; box-shadow:0 4px 20px rgba(0,0,0,0.6);
  }
  .music-panel.open{ display:flex; }
  .music-track-name{
    font-family:var(--disp); font-size:16px; color:var(--amber); letter-spacing:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .music-controls{ display:flex; gap:6px; }
  .music-controls button{ flex:1; margin:0; }
  .music-volume-row{ display:flex; align-items:center; gap:8px; }
  .music-volume-row input[type=range]{ flex:1; accent-color:var(--green); }
  #globalEditModeLabel input{ accent-color:var(--amber); }

  /* ---- Squad toolbar "⋮ Действия" menu: bundles the less-frequent actions (save/load JSON,
     print, clear roster) out of the always-visible toolbar row, same collapsible-panel pattern
     as the music player above. ---- */
  .squad-more-menu{
    display:none; flex-direction:column; gap:6px;
    position:absolute; top:100%; right:0; z-index:150; margin-top:4px;
    min-width:200px; background:#0b2415; border:1px solid var(--green); border-radius:4px;
    padding:10px; box-shadow:0 4px 20px rgba(0,0,0,0.6);
  }
  .squad-more-menu.open{ display:flex; }
  .squad-more-menu button{ width:100%; text-align:left; margin:0; }

  /* ---- Card art viewer: the small 🃏 icon next to a unit/item/perk that has scanned card art
     (see cardBtnHtml() / UNIT_CARD_BY_NAME etc.) opens #cardLightbox with that image — or several
     side by side for combo entries like "Frank Horrigan I+II" that just show both minis' cards.
     Images are only set on click, not on render, so browsing a roster never fetches art you
     didn't ask to see. ---- */
  .card-btn{ cursor:zoom-in; margin-left:1px; opacity:0.85; }
  .card-btn:hover{ opacity:1; }
  #cardLightbox{
    display:none; position:fixed; inset:0; z-index:1000; background:rgba(3,18,10,0.92);
    align-items:center; justify-content:center; cursor:zoom-out; padding:20px;
  }
  #cardLightbox.open{ display:flex; }
  #cardLightboxImages{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:center; max-width:94vw; max-height:94vh; }
  #cardLightboxImages img{ max-width:90vw; max-height:90vh; border-radius:6px; box-shadow:0 8px 40px rgba(0,0,0,0.7); }
  #cardLightboxImages.multi img{ max-width:42vw; max-height:85vh; }

  /* ---- Squad / Roster tab ---- */
  .squad-view{ flex:1; overflow-y:auto; padding:16px; min-height:0; }
  .squad-toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .squad-total{ color:var(--amber); font-family:var(--disp); font-size:17px; letter-spacing:1px; }
  .squad-total.mission-total{ color:var(--red); }
  .squad-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:14px; align-items:start; }
  .squad-card label{ margin-top:8px; }
  .tag-list{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px; }
  .tag{
    background:#0b2415; border:1px solid var(--green-dim); border-radius:3px;
    padding:2px 6px; font-size:11px; display:inline-flex; align-items:center; gap:6px;
  }
  .tag b{ cursor:pointer; color:var(--red); font-weight:normal; }
  .tag b:hover{ text-decoration:underline; }
  .caps-line{ margin:10px 0 4px; font-family:var(--disp); font-size:18px; color:var(--amber); }
  .caps-line small{ font-family:var(--mono); font-size:10px; color:#6fae86; }

  /* ---- Searchable combobox: replaces plain <select> where the option list is long (Unit/Items/
     Perks — hundreds of entries, hard to scroll-search natively). The real <select> stays in the
     DOM (visually hidden) so all existing onchange wiring keeps working unmodified — see
     enhanceCombos() in <script>. The dropdown list is appended to <body> and positioned with
     position:fixed so the scrollable .squad-view container can't clip it. ---- */
  .combo{ position:relative; }
  .combo select.combo-native{
    position:absolute; opacity:0; width:1px; height:1px; overflow:hidden; pointer-events:none;
  }
  .combo-list{
    position:fixed; z-index:200; max-height:240px; overflow-y:auto;
    background:#03120a; border:1px solid var(--green); border-radius:2px;
    box-shadow:0 4px 14px rgba(0,0,0,0.6);
  }
  .combo-group{
    padding:4px 8px; font-size:10px; text-transform:uppercase; letter-spacing:1px;
    color:var(--amber); background:#0b2415; position:sticky; top:0;
  }
  .combo-opt{ padding:6px 8px; font-size:13px; cursor:pointer; color:var(--green); }
  .combo-opt:hover, .combo-opt.active{ background:var(--green); color:#03120a; }
  .combo-empty{ padding:8px; font-size:12px; color:#6fae86; }

  /* ---- Mobile / touch layout: stage and sidebar stack, controls sized for fingers ---- */
  @media (max-width: 880px){
    header h1{ font-size:22px; }
    header .sub{ font-size:10px; }

    /* Tab switcher collapses into a hamburger dropdown so the map/squad view gets full width
       instead of three buttons + user label + edit toggle wrapping across several lines. */
    .hamburger-btn{
      display:flex; align-items:center; justify-content:center;
      width:40px; height:40px; font-size:20px; padding:0; margin:0;
    }
    .view-switch-menu{ display:none; }
    .view-switch-menu.open{
      display:flex; flex-direction:column; align-items:stretch; gap:8px;
      position:absolute; top:100%; left:0; right:0; background:#081209;
      border:1px solid var(--green-dim); border-top:none; padding:12px 14px; z-index:300;
    }
    .view-switch-menu.open button{ width:100%; margin:2px 0; text-align:left; }

    .layout{ flex-direction:column; position:relative; }
    .stage{ order:1; flex:1; height:auto; padding:8px; }

    /* Settlement controls become a bottom sheet: collapsed to nothing by default (map gets the
       full screen), expands over most of the viewport when the toggle button is tapped, instead
       of a permanently cramped 46vh strip nobody could comfortably tap inside. */
    .sidebar{
      width:100%; border-right:none; border-top:2px solid var(--green-dim);
      position:fixed; left:0; right:0; bottom:0; z-index:250; background:var(--panel);
      max-height:0; padding:0; overflow:hidden; transition:max-height .25s ease;
    }
    .sidebar.open{
      max-height:82vh; padding:14px 14px 64px; overflow-y:auto;
      box-shadow:0 -6px 24px rgba(0,0,0,0.6);
    }
    .sidebar-toggle-btn{
      display:flex; align-items:center; justify-content:center; gap:6px;
      position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:260;
      padding:10px 18px; border-radius:20px; margin:0;
      box-shadow:0 2px 12px rgba(0,0,0,0.6);
    }

    label{ font-size:13px; margin:9px 0 4px; }
    input[type=text], input[type=number], select{ padding:10px 8px; font-size:15px; }
    button{ font-size:17px; padding:10px 12px; min-height:42px; }
    .mode-btns button{ margin:3px 0; }
    legend{ font-size:21px; }
    table.log{ font-size:12px; }
    table.log th, table.log td{ padding:6px 5px; }
    .squad-grid{ grid-template-columns:1fr; }
    .squad-toolbar{ flex-direction:column; align-items:stretch; }
    .combo-opt{ padding:10px 10px; font-size:15px; }
  }
</style>
</head>
<body>

<header>
  <h1>HOMESTEAD // LAYOUT TERMINAL</h1>
  <div class="sub">FALLOUT: WASTELAND WARFARE — SETTLEMENT GRID SIMULATOR v1.0</div>
</header>

<div class="view-switch">
  <button id="hamburgerBtn" class="hamburger-btn" type="button" aria-label="Меню">☰</button>
  <div class="view-switch-menu" id="viewSwitchMenu">
    <button id="viewLayoutBtn" data-view="layout" class="active">▣ Поселение</button>
    <button id="viewSquadBtn" data-view="squad">◈ Отряд</button>
    <button id="viewWarehouseBtn" data-view="warehouse">▧ Склад</button>
    <button id="musicBtn" type="button" title="Радио Пустошей">🎵 Радио Пустошей</button>
    <label id="globalEditModeLabel" style="display:flex;align-items:center;gap:6px;margin:0 0 0 auto;font-size:12px;text-transform:none;letter-spacing:0;cursor:pointer;">
      <input type="checkbox" id="globalEditModeToggle"> Режим редактирования (бесплатно, в обход правил)
    </label>
  </div>
</div>

<div class="music-panel" id="musicPanel">
  <div class="music-track-name" id="musicTrackName">—</div>
  <div class="music-controls">
    <button id="musicPrevBtn" title="Предыдущий трек">⏮</button>
    <button id="musicPlayBtn" title="Play/Пауза">▶</button>
    <button id="musicNextBtn" title="Следующий трек">⏭</button>
  </div>
  <div class="music-volume-row">
    <span>🔊</span>
    <input type="range" id="musicVolume" min="0" max="100" value="60">
  </div>
</div>

<div id="cardLightbox">
  <div id="cardLightboxImages"></div>
</div>

<div class="layout" id="layoutView">
  <div class="sidebar" id="sidebar"></div>
  <div class="stage" id="stage">
    <div class="stage-inner" id="stageInner"></div>
    <div class="zoom-controls">
      <button id="btnZoomIn" title="Приблизить">+</button>
      <button id="btnZoomOut" title="Отдалить">−</button>
      <button id="btnZoomReset" title="Сбросить масштаб">⤢</button>
    </div>
  </div>
  <button id="sidebarToggleBtn" class="sidebar-toggle-btn" type="button">▲ Панель управления</button>
</div>

<div class="squad-view" id="squadView" style="display:none;"></div>
<div class="squad-view" id="warehouseView" style="display:none;"></div>

<div class="toast" id="toast"></div>

<script>
/* ============================= STATE ============================= */
const GRID = 36;
const PALETTE = ["#8fd3c7","#f2c14e","#f78154","#b0a8b9","#5fad56","#ff9b85","#79addc","#c9cba3","#e2a0ff","#ffd670","#70d6ff","#e07a5f"];

/* Structures extracted from the FWW Homestead rulebook (Settlement Sheet, p.6-9).
   small = true for structure types listed as "Small Structures" on p.3
   (all Crafting except Creature Pen, all Boost, all Infrastructure except Crop Field, Lockers, Turrets). */
const STRUCTURES_DB = [
  {cat:'Building', name:'Hut', cost:'80', size:4, doors:2},

  {cat:'Defense', name:'Watch Tower', cost:'80', size:4, doors:0, notes:'Мин. Green (8) от других Watch Tower'},

  {cat:'Priority', name:'Barracks', cost:'130', size:8, doors:2},
  {cat:'Priority', name:'Medical Centre', cost:'130', size:8, doors:1},

  {cat:'Infrastructure', name:'Generator – Small', cost:'100', size:1, doors:0, small:true},
  {cat:'Infrastructure', name:'Generator – Medium', cost:'200', size:2, doors:0, small:true},
  {cat:'Infrastructure', name:'Generator – Large', cost:'300', size:2, doors:0, small:true},
  {cat:'Infrastructure', name:'Water Pump', cost:'50', size:1, doors:0, small:true},
  {cat:'Infrastructure', name:'Water Purifier', cost:'100', size:2, doors:0, small:true},
  {cat:'Infrastructure', name:'Crop Field', cost:'30', size:4, doors:0, notes:'Max 5, без стен', max:5},

  {cat:'Crafting', name:'Weapons Workbench', cost:'100', size:2, doors:0, small:true},
  {cat:'Crafting', name:'Armor Workbench', cost:'100', size:2, doors:0, small:true},
  {cat:'Crafting', name:'Power Armor Station', cost:'100', size:2, doors:0, small:true},
  {cat:'Crafting', name:'Chemistry Station', cost:'100', size:2, doors:0, small:true},
  {cat:'Crafting', name:'Cooking Station', cost:'100', size:2, doors:0, small:true},
  {cat:'Crafting', name:'Robot Workbench', cost:'100', size:2, doors:0, small:true},
  {cat:'Crafting', name:'Creature Pen', cost:'100', size:4, doors:1, notes:'Не Small (исключение)'},

  {cat:'Item', name:'Scavenging (Draw 1)', cost:'50', size:4, doors:0},
  {cat:'Item', name:'Scavenging (Draw 2)', cost:'100', size:4, doors:0},
  {cat:'Item', name:'Scavenging (Draw 3)', cost:'150', size:8, doors:2},
  {cat:'Item', name:'Trading (Draw 1)', cost:'100', size:4, doors:0},
  {cat:'Item', name:'Trading (Draw 2)', cost:'150', size:4, doors:0},
  {cat:'Item', name:'Trading (Draw 3)', cost:'200', size:8, doors:2},
  {cat:'Item', name:'Weapons (Draw 1)', cost:'100', size:4, doors:0},
  {cat:'Item', name:'Weapons (Draw 2)', cost:'150', size:4, doors:0},
  {cat:'Item', name:'Weapons (Draw 3)', cost:'200', size:8, doors:2},
  {cat:'Item', name:'Armor (Draw 1)', cost:'100', size:4, doors:0},
  {cat:'Item', name:'Armor (Draw 2)', cost:'150', size:4, doors:0},
  {cat:'Item', name:'Armor (Draw 3)', cost:'200', size:8, doors:2},
  {cat:'Item', name:'Clothing (Draw 1)', cost:'100', size:4, doors:0},
  {cat:'Item', name:'Clothing (Draw 2)', cost:'150', size:4, doors:0},
  {cat:'Item', name:'Clothing (Draw 3)', cost:'200', size:8, doors:2},
  {cat:'Item', name:'Drink (Draw 1)', cost:'100', size:4, doors:0},
  {cat:'Item', name:'Drink (Draw 2)', cost:'150', size:4, doors:0},
  {cat:'Item', name:'Drink (Draw 3)', cost:'200', size:8, doors:2},
  {cat:'Item', name:'First Aid (Draw 1)', cost:'100', size:4, doors:0},

// Cost as printed in STRUCTURES_DB is one of: a plain Caps number, 'FREE', or an ambiguous
// formula that can't be auto-charged here — Turret ("x5 Caps оружия", depends on the weapon
// equipped) and the 4 Boost structures ("35/55/75", depends on which Draw-tier you pick, and
// unlike the Item category these were never split into separate tiered DB entries). Returns
// null for the ambiguous case so callers know NOT to gate/charge automatically.
function parseStructureCapsCost(costStr){
  if(costStr === 'FREE') return 0;
  if(/^\d+$/.test(costStr)) return Number(costStr);
  return null;
}
// Settlement Sheet (FWW: Homestead, p.6-7): each built Generator/Water structure contributes a
// fixed amount regardless of status (Damaged/Wrecked structures are still counted here — this is
// a simple running total for the resource tracker, not a full Settlement-Use power/water
// allocation simulation).
const ENERGY_PRODUCTION = { 'Generator – Small': 3, 'Generator – Medium': 7, 'Generator – Large': 12 };
const WATER_PRODUCTION = { 'Water Pump': 3, 'Water Purifier': 12 };
// FWW Homestead p.4: "Land: 500 OR Complete 5 Quests" — flat 500 Caps per Land purchase,
// same price whichever level you're buying (1->2, 2->3, 3->4), we only track the Caps path.
const LAND_COST_PER_LEVEL = 500;
function computeEnergy(){
  return Object.values(state.structures).reduce((sum,s)=> sum + (ENERGY_PRODUCTION[s.name]||0), 0);
}
// Book (p.4-5): "At the end of using their Settlement, a player must discard any Resources in
// excess of the maximum Resources which can be held by their Resource Sheds" + "Resource Shed
// ... Allows a number of Resources to be kept ... up to double its size." Uses the structure's
// actual drawn cell count (not a hardcoded 4) so a custom/extended Resource Shed still works.
function computeMaxResource(){
  return 2 * Object.values(state.structures).reduce((sum,s)=> sum + (s.name==='Resource Shed' ? s.cells.length : 0), 0);
}
function computeWater(){
  return Object.values(state.structures).reduce((sum,s)=> sum + (WATER_PRODUCTION[s.name]||0), 0);
}
function buildStructTypeOptions(selectedIdx){
  const cats = [...new Set(STRUCTURES_DB.map(s=>s.cat))];
  const caps = state.resources.caps;
  const free = !!state.editMode;
  return `<option value="" ${selectedIdx===''||selectedIdx===undefined?'selected':''}>— выбрать из книги правил (или Custom ниже) —</option>` +
    cats.map(cat=>{
      const opts = STRUCTURES_DB.map((s,i)=>({s,i})).filter(x=>x.s.cat===cat)
        // A type that's already at its max count (Crop Field, Brahmin Ranch, etc.) is dropped
        // from the list entirely rather than just disabled — there's nothing useful left to pick.
        .filter(x=>{
          if(!x.s.max) return true;
          const count = Object.values(state.structures).filter(st=>st.name===x.s.name).length;
          return count < x.s.max;
        })
        .map(x=>{
          const cost = parseStructureCapsCost(x.s.cost);
          const afford = free || cost===null || cost<=caps;
          const priceLabel = x.s.cost==='FREE' ? 'бесплатно' : `${x.s.cost} крышек`;
          const label = `${x.s.name}${x.s.small?' ★':''} — ${priceLabel}${afford?'':' (не хватает крышек)'}`;
          return `<option value="${x.i}" ${String(selectedIdx)===String(x.i)?'selected':''} ${afford?'':'disabled'}>${label}</option>`;
        }).join('');
      return opts ? `<optgroup label="${cat}">${opts}</optgroup>` : '';
    }).join('');
}

/* ============================= SEARCHABLE COMBOBOX ============================= */
// Progressive-enhancement layer for long <select> lists (Unit ~450, Items ~575, Perks ~85+29):
// scrolling a native <select> to find one entry is painful, so any <select class="combo-enhance">
// wrapped in <div class="combo"> gets a type-to-filter text input on top of it. The <select>
// itself is kept in the DOM (just visually hidden via CSS) and stays the single source of truth —
// picking an option sets its .value and fires a real 'change' event, so every existing onchange
// handler in attachSquadEvents()/attachWarehouseEvents() keeps working untouched.
//
// data-combo-mode on the <select>:
//   'value'  — persistent single selection; the input shows the current label when not editing
//              (Unit, Leader Perk, the Warehouse "add item" picker).
//   'action' — fire-and-clear; picking immediately triggers the existing onchange handler (which
//              adds a Perk/Item) and the input goes back to blank, ready for the next pick
//              (Perks add-select, member Items add-select).
// The dropdown list is appended to <body> and positioned with position:fixed (not appended inside
// the card) specifically so it can't be clipped by .squad-view's overflow-y:auto.
function enhanceCombos(root){
  root.querySelectorAll('select.combo-enhance').forEach(select=>{
    const wrap = select.closest('.combo');
    if(!wrap) return;
    const mode = select.dataset.comboMode || 'value';
    select.tabIndex = -1; // keyboard users tab through the visible input, not the hidden select

    const items = [];
    const pushItem = (opt, group) => {
      if(opt.disabled) return;
      if(opt.value === '' && mode === 'action') return; // no "add nothing" no-op entry needed
      items.push({ value: opt.value, label: opt.textContent, group: group || null });
    };
    Array.from(select.children).forEach(node=>{
      if(node.tagName === 'OPTGROUP') Array.from(node.children).forEach(o=>pushItem(o, node.label));
      else if(node.tagName === 'OPTION') pushItem(node, null);
    });

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'combo-input';
    input.autocomplete = 'off';
    input.placeholder = select.dataset.comboPlaceholder || 'Поиск…';
    const selectedOpt = select.options[select.selectedIndex];
    input.value = (mode === 'value' && selectedOpt && selectedOpt.value !== '') ? selectedOpt.textContent : '';
    wrap.appendChild(input);

    let list = null; // created on open / appended to <body>, destroyed on close — see closeList()

    function reposition(){
      if(!list) return;
      const r = input.getBoundingClientRect();
      list.style.left = r.left + 'px';
      list.style.top = (r.bottom + 2) + 'px';
      list.style.width = r.width + 'px';
    }
    // Closing used to happen on the input's blur — but on mobile, dismissing the on-screen
    // keyboard (to see the list full-screen instead of squeezed above it) *also* blurs the
    // input, so the list vanished right when you'd want it to stay open. Closing on a genuine
    // tap/click outside the combo (input + list) instead means the keyboard can come and go
    // freely without touching the list.
    function outsideCloseHandler(e){
      if(list && !wrap.contains(e.target) && !list.contains(e.target)) closeList();
    }
    function closeList(){
      if(!list) return;
      list.remove();
      list = null;
      window.removeEventListener('scroll', reposition, true);
      window.removeEventListener('resize', reposition);
      document.removeEventListener('pointerdown', outsideCloseHandler, true);
    }
    function renderList(filterText){
      const q = (filterText || '').trim().toLowerCase();
      const filtered = q ? items.filter(it => it.label.toLowerCase().includes(q)) : items;
      if(!list){
        list = document.createElement('div');
        list.className = 'combo-list';
        document.body.appendChild(list);
        reposition();
        window.addEventListener('scroll', reposition, true);
        window.addEventListener('resize', reposition);
        document.addEventListener('pointerdown', outsideCloseHandler, true);
      }
      if(!filtered.length){
        list.innerHTML = `<div class="combo-empty">Ничего не найдено</div>`;
        return;
      }
      let html = '', lastGroup = null;
      filtered.forEach(it=>{
        if(it.group && it.group !== lastGroup){
          html += `<div class="combo-group">${it.group}</div>`;
          lastGroup = it.group;
        }
        html += `<div class="combo-opt" data-value="${String(it.value).replace(/"/g,'&quot;')}">${it.label}</div>`;
      });
      list.innerHTML = html;
      list.onmousedown = (e)=>{
        // mousedown (not click) fires before the input's blur, so a pick registers before
        // the blur-triggered closeList() below would otherwise tear the list down first.
        const opt = e.target.closest('.combo-opt');
        if(!opt) return;
        e.preventDefault();
        pick(opt.dataset.value, opt.textContent);
      };
    }
    function pick(value, label){
      select.value = value;
      select.dispatchEvent(new Event('change', { bubbles: true }));
      input.value = (mode === 'action' || value === '') ? '' : label;
      closeList();
    }

    input.addEventListener('focus', ()=> renderList(''));
    input.addEventListener('input', ()=> renderList(input.value));
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape'){ closeList(); input.blur(); return; }
      if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
        e.preventDefault();
        if(!list) renderList(input.value);
        const opts = list.querySelectorAll('.combo-opt');
        if(!opts.length) return;
        let idx = Array.from(opts).findIndex(o=>o.classList.contains('active'));
        idx = e.key === 'ArrowDown' ? Math.min(idx + 1, opts.length - 1) : Math.max(idx - 1, 0);
        opts.forEach(o=>o.classList.remove('active'));
        opts[idx].classList.add('active');
        opts[idx].scrollIntoView({ block: 'nearest' });
      } else if(e.key === 'Enter'){
        if(!list) return;
        const active = list.querySelector('.combo-opt.active');
        if(active){ e.preventDefault(); pick(active.dataset.value, active.textContent); }
      }
    });
  });
}

/* ---- Persistence: this is the static, no-account build (GitHub Pages / Netlify) — everything
   lives in this browser's own localStorage, on this device only. No login, no server, nothing
   to lose access to. Use "⭳ Скачать JSON" / "⭱ Загрузить JSON" (see Отряд toolbar) to move a
   save between devices or share it with someone else. ---- */
const LOCAL_STATE_KEY = 'homestead-state';
function saveState(){
  try{
    localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(state));
  }catch(e){ console.warn('save failed', e); toast('Не удалось сохранить — хранилище браузера недоступно или переполнено.', true); }
}
async function loadState(){
  try{
    const raw = localStorage.getItem(LOCAL_STATE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Object.keys(parsed).length){
        state = Object.assign(state, parsed);
        state.edges = migrateEdges(state.edges || {});
        migrateSquadItems();
      }
    }
  }catch(e){ /* no saved state yet, or it didn't parse */ }
}

// Unit is chosen at creation time and locked afterward — see HOMESTEAD_TOOL_CONTEXT.md; to swap

function addSquadMemberWithUnit(unitIdx){
  const id = state.squad.nextMemberId++;

    id, unitIdx, name: '', leader: false, heroic: false, mission: false, leaderPerk: null,

    automatronTorso: null, automatronLegs: null, // only meaningful when unitIdx is an Automatron head
  };

  grantInnateModsForUnit(id, unitIdx);

function deleteSquadMember(id){

// rerender=false is used by typed (text/number) inputs so a keystroke doesn't rebuild the DOM

function setSquadLeader(id){

// UNITS_DB[idx][4] lists items a unit canonically "does carry" (from the Frontier Factions xlsx,
// specific named gear only — generic categories were filtered out when the DB was built). The
// unit's own cost already had these items' prices subtracted, so granting them as real Warehouse
// instances (rather than a flat discount) makes the math come out even while leaving them fully
// normal, removable/transferable items. Granted only ONCE per (member, unit) pair — ever — so
// toggling Unit A -> B -> A doesn't hand out duplicates.
function grantInnateForUnit(memberId, unitIdx){
  const m = state.squad.members[memberId];
  if(!m || unitIdx === null || unitIdx === undefined) return;
  const unit = UNITS_DB[unitIdx];
  const innateItems = unit && unit[4];
  if(!innateItems || !innateItems.length) return;
  if(!m.grantedInnateForUnits) m.grantedInnateForUnits = [];
  if(m.grantedInnateForUnits.includes(unitIdx)) return;
  m.grantedInnateForUnits.push(unitIdx);
  innateItems.forEach(([itemIdx, qty])=>{
    for(let i=0; i<qty; i++){
      const id = state.warehouse.nextInstId++;
      state.warehouse.items[id] = makeItemInstance(id, itemIdx, memberId);
      state.warehouse.items[id].innate = true; // see itemChipHtml() — locked from removal for Robot/Creature/Dog
    }
  });
}
// A few Creature "boss" profiles (e.g. Deathclaw Matriarch) come with Creature Mods pre-installed
// by default — unlike innate ITEMS these are ordinary, fully removable/swappable char_mods, just
// seeded at creation instead of picked by hand. Keyed by unit NAME rather than added as a new
// UNITS_DB tuple field, since it's a rare exception, not worth reshaping every existing row for.
const UNIT_INNATE_MODS = {
  'Deathclaw Matriarch I': ['Conditioning: Active','Conditioning: Hit and Run','Conditioning: Haymaker','Conditioning: Rage'],
  'Deathclaw Matriarch II': ['Conditioning: Haymaker','Conditioning: Rage'],
  'Deathclaw Matriarch I+II': ['Conditioning: Active','Conditioning: Hit and Run','Conditioning: Haymaker','Conditioning: Rage'],
};
// Deathclaw Matriarch I legitimately ships with 4 pre-installed mods — see getModCapForUnit().
const UNIT_MOD_CAP_OVERRIDE = { 'Deathclaw Matriarch I': 4, 'Deathclaw Matriarch I+II': 4 };
function getModCapForUnit(unitIdx){
  const u = (unitIdx!==null && unitIdx!==undefined) ? UNITS_DB[unitIdx] : null;
  return (u && UNIT_MOD_CAP_OVERRIDE[u[1]]) || 2;
}
function grantInnateModsForUnit(memberId, unitIdx){
  const m = state.squad.members[memberId];
  const unit = (unitIdx!==null && unitIdx!==undefined) ? UNITS_DB[unitIdx] : null;
  if(!m || !unit) return;
  const modNames = UNIT_INNATE_MODS[unit[1]];
  if(!modNames || !modNames.length) return;
  if(!m.grantedInnateModsForUnits) m.grantedInnateModsForUnits = [];
  if(m.grantedInnateModsForUnits.includes(unitIdx)) return;
  m.grantedInnateModsForUnits.push(unitIdx);
  if(!m.mods) m.mods = [];
  modNames.forEach(name=>{
    const itemIdx = ITEMS_DB.findIndex(it=>it[1]==='Mod' && it[2]===name);
    if(itemIdx<0) return;
    m.mods.push(mintModInstance(itemIdx, memberId));
  });
}
function addPerkToMember(id, perkIdxStr){

  const innate = unit && unit[3] ? unit[3] : [];

function capsForMember(m){
  let total = 0;
  const isAuto = isAutomatronHeadIdx(m.unitIdx);
  const headCost = (m.unitIdx!==null && m.unitIdx!==undefined && UNITS_DB[m.unitIdx]) ? UNITS_DB[m.unitIdx][2] : 0;
  const baseCost = isAuto ? headCost + automatronPartsCost(m) : headCost; // head+torso+legs for an Automatron
  total += baseCost;
  const modType = unitModTypeForIdx(m.unitIdx); // 'Robot Mod' | 'Creature Mod' | null
  const isDog = isDogUnitIdx(m.unitIdx);
  if(m.heroic && !isDog){
    // Robot/Creature get their own trait (Clunky/Wild) instead of Heroic — a 20% cost CUT, not
    // an add-on, per the book entries ('Heroic','Clunky',-0.2) / ('Heroic','Wild ',-0.2). Dogs
    // just lose Heroic outright — no replacement trait. An Automatron with a Sentry Bot torso but
    // no Sentry Bot legs/head is the one config where Clunky doesn't apply at all.
    if(modType && !(isAuto && automatronClunkyBlocked(m))) total -= Math.ceil(baseCost * 0.2);
    else if(!modType) total += 48;
  }
  if(m.leader && m.leaderPerk!==null && m.leaderPerk!==undefined && LEADER_PERKS_DB[m.leaderPerk]) total += LEADER_PERKS_DB[m.leaderPerk][1];
  if(!modType && !isDog){
    for(const idx of m.perks){ if(PERKS_DB[idx]) total += PERKS_DB[idx][1]; }
  }
  for(const inst of itemsHeldBy(m.id)){ if(ITEMS_DB[inst.itemIdx]) total += ITEMS_DB[inst.itemIdx][3]; }
  return total;
}

const DOG_UNIT_NAMES = new Set([
  'Dog','Dogmeat','Dogmeat Guard Dog','Dogmeat Scout','Rex','CX404*','Mutant Hound',
  'Mutant Hound Fiend','Legion Mongrel',
]);
function isDogUnitIdx(unitIdx){
  const u = (unitIdx!==null && unitIdx!==undefined) ? UNITS_DB[unitIdx] : null;
  return !!(u && DOG_UNIT_NAMES.has(u[1]));
}
// The 5 "Automatrons" faction rows below double as Automatron HEAD choices (same cost as a
// plain standalone robot of that name) — see the automatron section further down.
const AUTOMATRON_HEAD_NAMES = new Set(['Assaultron','Mr.Handy','Protectron','Robobrain','Sentry Bot']);
function isAutomatronHeadIdx(unitIdx){
  const u = (unitIdx!==null && unitIdx!==undefined) ? UNITS_DB[unitIdx] : null;
  return !!(u && u[0]==='Automatrons' && AUTOMATRON_HEAD_NAMES.has(u[1]));
}
function unitModTypeForIdx(unitIdx){
  const u = (unitIdx!==null && unitIdx!==undefined) ? UNITS_DB[unitIdx] : null;
  if(!u) return null;
  if(isAutomatronHeadIdx(unitIdx)) return 'Robot Mod';
  if(ROBOT_UNIT_NAMES.has(u[1])) return 'Robot Mod';
  if(CREATURE_UNIT_NAMES.has(u[1])) return 'Creature Mod';
  return null;
}
// Unattached mod instances (sitting in Warehouse stock) eligible for this host item — matched by
// slot type, plus the Handmade-Rifle-only restriction where it applies.
function compatibleModInstancesForItem(hostItemIdx){
  const it = ITEMS_DB[hostItemIdx];
  const slot = it ? modSlotForCategory(it[1]) : null;
  if(!slot) return [];
  return itemsInWarehouse().filter(inst=>{
    const slots = MOD_SLOT_MAP[inst.itemIdx];
    if(!slots || !slots.includes(slot)) return false;
    const modName = ITEMS_DB[inst.itemIdx][2];
    const restrict = MOD_ITEM_RESTRICTION[modName];
    return !restrict || restrict === it[2];
  });
}
function compatibleModInstancesForMember(memberId){
  const m = state.squad.members[memberId];
  const slot = m ? unitModTypeForIdx(m.unitIdx) : null;
  if(!slot) return [];
  return itemsInWarehouse().filter(inst=>{
    const slots = MOD_SLOT_MAP[inst.itemIdx];
    return slots && slots.includes(slot);
  });
}
function attachMod(hostInstId, modInstId){
  const host = state.warehouse.items[hostInstId];
  const mod = state.warehouse.items[modInstId];
  if(!host || !mod) return;
  if(host.modInstId){ toast('На этот предмет уже установлен мод — сначала открепите текущий.', true); return; }
  mod.holder = host.holder;
  host.modInstId = mod.id;
  saveState();
  render();
}
function detachMod(hostInstId){
  const host = state.warehouse.items[hostInstId];
  if(!host || !host.modInstId) return;
  const mod = state.warehouse.items[host.modInstId];
  if(mod) mod.holder = 'warehouse';
  delete host.modInstId;
  saveState();
  render();
}
function attachMemberMod(memberId, modInstId){
  const m = state.squad.members[memberId];
  const mod = state.warehouse.items[modInstId];
  if(!m || !mod) return;
  if(!m.mods) m.mods = [];
  const modCap = getModCapForUnit(m.unitIdx);
  if(m.mods.length >= modCap){ toast(`У юнита уже установлено максимум ${modCap} мод(ов).`, true); return; }
  mod.holder = memberId;
  m.mods.push(modInstId);
  saveState();
  render();
}
function detachMemberMod(memberId, modInstId){
  const m = state.squad.members[memberId];
  if(!m || !m.mods) return;
  const pos = m.mods.indexOf(modInstId);
  if(pos<0) return;
  m.mods.splice(pos,1);
  const mod = state.warehouse.items[modInstId];
  if(mod) mod.holder = 'warehouse';
  saveState();
  render();
}
// Edit mode: mints a fresh mod instance straight onto its holder, bypassing the Warehouse stock
// check entirely — same "in obход склада" convention already used for regular items.
function mintModInstance(itemIdx, holder){
  const id = state.warehouse.nextInstId++;
  state.warehouse.items[id] = makeItemInstance(id, itemIdx, holder);
  return id;
}
// Catalog options (value="new:<itemIdx>") for every DB mod matching this slot — edit-mode only.
function modCatalogOptionsHtml(slot, hostName){
  return Object.keys(MOD_SLOT_MAP).filter(idx=>{
    if(!MOD_SLOT_MAP[idx].includes(slot)) return false;
    const restrict = MOD_ITEM_RESTRICTION[ITEMS_DB[idx][2]];
    return !restrict || restrict === hostName;
  }).map(idx=>{
    const it = ITEMS_DB[idx];
    return `<option value="new:${idx}">${it[2]} (${it[3]}) — новый, в обход склада</option>`;
  }).join('');
}
function attachModValue(hostInstId, value){
  if(value === '') return;
  const host = state.warehouse.items[hostInstId];
  if(!host) return;
  if(value.startsWith('new:')){
    if(!state.editMode) return;
    attachMod(hostInstId, mintModInstance(Number(value.slice(4)), host.holder));
  } else {
    attachMod(hostInstId, Number(value));
  }
}
function attachMemberModValue(memberId, value){
  if(value === '') return;
  const m = state.squad.members[memberId];
  if(!m) return;
  if(value.startsWith('new:')){
    if(!state.editMode) return;
    attachMemberMod(memberId, mintModInstance(Number(value.slice(4)), memberId));
  } else {
    attachMemberMod(memberId, Number(value));
  }
}
// Rendered inside a host item's card (armor-card) — either the attached mod + detach button, or
// an attach picker (Warehouse stock, plus a full-catalog option in edit mode). Nothing at all if
// there's nothing to offer — no "no mods available" clutter on every unmoddable-right-now item.
function modSlotHtml(hostInst){
  const it = ITEMS_DB[hostInst.itemIdx];
  const slot = it ? modSlotForCategory(it[1]) : null;
  if(!slot) return '';
  if(hostInst.modInstId){
    const modInst = state.warehouse.items[hostInst.modInstId];
    const modIt = modInst ? ITEMS_DB[modInst.itemIdx] : null;
    return `<span>Мод: ${modIt?modIt[2]:'?'} ${cardBtnHtml(modIt?modIt[2]:'', ITEM_CARD_BY_NAME)}</span> <button class="ghost" data-detachmod="${hostInst.id}">Открепить</button>`;
  }
  let options = compatibleModInstancesForItem(hostInst.itemIdx).map(mi=>{
    const mit = ITEMS_DB[mi.itemIdx];
    return `<option value="${mi.id}">${mit[2]} (${mit[3]})</option>`;
  }).join('');
  if(state.editMode) options += modCatalogOptionsHtml(slot, it[2]);
  if(!options) return '';
  return `<select data-modselect="${hostInst.id}" style="width:auto; max-width:150px;"><option value="">— мод —</option>${options}</select> <button data-attachmod="${hostInst.id}">+Мод</button>`;
}

/* ---- Export to Wasteland Workshop (achapin.github.io/wastelandworkshop) ----
   That fan builder keeps its entire list state in the URL query string (its own "Export List"
   button literally just saves everything after "?" to a .txt; "Import List" reads it straight
   back) — so instead of a file round-trip we build that same query string ourselves and open it
   in a new tab. Format reverse-engineered from its builder.js: "f=..;n=..;l=leaderIdx,perkIdx;
   <char1>;<char2>;...;" where each <charN> is JSON.stringify(obj) with '"' swapped for '!'.
   Names/mods/perks/items there use their own slugs (snake_case), not ours — the *_SLUG_* tables

   every one of our entries has a counterpart there; anything unmapped is skipped and reported. */
function buildSlugMapByIdx(defs){
  const map = {};
  defs.forEach(([group,name,slug])=>{
    const idx = ITEMS_DB.findIndex(it => it[0]===group && it[2]===name);
    if(idx>=0) map[idx] = slug;
  });
  return map;
}

/* ---- Per-robot weapon restrictions ----
   Almost every robot has ONE fixed must_carry weapon (already granted as a locked innate item —
   see grantInnateForUnit) and gets NO extra weapon at all. Exactly 3 robots break that pattern by
   picking from a same-brand family instead of a fixed weapon, up to a stated cap — confirmed by
   these being the only 3 robots in ww's data with no must_carry entry at all. A small fixed set
   of non-weapon items (hats, repair kit) is available to every robot regardless, plus two "unlock"
   items (Third-Arm Clamp / Robobrain Arms) that open a small non-robo weapon slot once equipped. */
const ROBOT_WEAPON_FAMILY = {
  'Mr Gutsy': { names: ['Mr Handy Buzzsaw','Mr Handy Flamer','Mr Handy Plasma Pistol','Mr Handy Laser','Mr Handy SMG'], max: 3 },
  'Mr.Gutsy': { names: ['Mr Handy Buzzsaw','Mr Handy Flamer','Mr Handy Plasma Pistol','Mr Handy Laser','Mr Handy SMG'], max: 3 },
  'Robobrain': { names: ['Robobrain Mesmetron','Robobrain Laser'], max: 1 },
  'Securitron mk2': { names: ['Weapon Securitron Gatling Laser','Weapon Securitron Missile Launcher','Securitron Grenade Launcher','Securitron SMG'], max: 2 },
};
const ROBOT_UNIVERSAL_ITEM_NAMES = new Set(['Bowler Hat','Triggerman Bowler','Robot Repair Kit']);
const MR_HANDY_FAMILY_UNITS = new Set(['Mr Handy','Mr.Handy','Miss Nanny','Mr Gutsy','Mr.Gutsy']);
const MR_HANDY_BONUS_NAMES = new Set(['Mr Handy Fuel','Third-Arm Clamp']);
const NON_ROBO_WEAPON_CATS = ['Rifle','Pistol','Melee','Heavy','Thrown'];
function countHeldItemsMatching(memberId, predicate){
  return itemsHeldBy(memberId).filter(predicate).length;
}
function isNonRobotTaggedIdx(itemIdx){
  const tags = ITEM_TAG_BY_IDX[itemIdx];
  return !(tags && tags.includes('robot'));
}
function robotItemAllowed(itemIdx, member){
  const unit = UNITS_DB[member.unitIdx];
  const it = ITEMS_DB[itemIdx];
  const unitName = unit[1], name = it[2], cat = it[1];
  if(ROBOT_UNIVERSAL_ITEM_NAMES.has(name)) return true;
  const family = ROBOT_WEAPON_FAMILY[unitName];
  if(family && family.names.includes(name)){
    return countHeldItemsMatching(member.id, inst => family.names.includes(ITEMS_DB[inst.itemIdx][2])) < family.max;
  }
  if(MR_HANDY_FAMILY_UNITS.has(unitName) && MR_HANDY_BONUS_NAMES.has(name)) return true;
  if(unitName === 'Robobrain' && name === 'Robobrain Arms') return true;
  if(!NON_ROBO_WEAPON_CATS.includes(cat) || !isNonRobotTaggedIdx(itemIdx)) return false;
  const hasThirdArmClamp = countHeldItemsMatching(member.id, inst => ITEMS_DB[inst.itemIdx][2]==='Third-Arm Clamp') > 0;
  const hasRobobrainArms = countHeldItemsMatching(member.id, inst => ITEMS_DB[inst.itemIdx][2]==='Robobrain Arms') > 0;
  if(hasThirdArmClamp && ['Pistol','Melee','Thrown'].includes(cat)){
    const used = countHeldItemsMatching(member.id, inst => {
      const oi = ITEMS_DB[inst.itemIdx];
      return ['Pistol','Melee','Thrown'].includes(oi[1]) && isNonRobotTaggedIdx(inst.itemIdx);
    });
    if(used < 1) return true;
  }
  if(hasRobobrainArms){
    if(['Pistol','Melee'].includes(cat)){
      const used = countHeldItemsMatching(member.id, inst => {
        const oi = ITEMS_DB[inst.itemIdx];
        return ['Pistol','Melee'].includes(oi[1]) && isNonRobotTaggedIdx(inst.itemIdx);
      });
      if(used < 2) return true;
    }
    if(cat === 'Rifle'){
      const used = countHeldItemsMatching(member.id, inst => ITEMS_DB[inst.itemIdx][1]==='Rifle' && isNonRobotTaggedIdx(inst.itemIdx));
      if(used < 1) return true;
    }
  }
  return false;
}
/* ---- Automatron: a robot built from Head/Torso/Legs instead of picked whole. Head reuses the
   existing "Automatrons" faction unit rows (m.unitIdx, cost, locked like any other Unit); Torso
   and Legs are stored directly on the member (m.automatronTorso/m.automatronLegs, both freely
   editable — the "lock the Unit" rule was about the base Unit pick, not these sub-parts) and
   costed from the tables below. Only Mr Handy head+torso must pair together — everything else
   mixes freely. No must_carry: every weapon/mod slot here is a manual pick, unlike a plain robot. */
const AUTOMATRON_TORSO_COST = { 'Assaultron':60, 'Junkbot':12, 'Mr Handy':17, 'Protectron':33, 'Robobrain':29, 'Sentry Bot':116 };
const AUTOMATRON_LEGS_COST = { 'Assaultron':55, 'Mr Handy':27, 'Protectron':4, 'Robobrain':10, 'Sentry Bot':8 };
const AUTOMATRON_HEAD_LOCKED_WEAPONS = { 'Assaultron Head Laser':'Assaultron', 'Robobrain Laser':'Robobrain', 'Robobrain Mesmetron':'Robobrain' };
function automatronPartsCost(m){
  return (AUTOMATRON_TORSO_COST[m.automatronTorso]||0) + (AUTOMATRON_LEGS_COST[m.automatronLegs]||0);
}
// Sentry Bot torso without Sentry Bot legs AND without a Sentry Bot head is the one config where
// Clunky doesn't apply — see capsForMember().
function automatronClunkyBlocked(m){
  const unit = UNITS_DB[m.unitIdx];
  return m.automatronTorso === 'Sentry Bot' && m.automatronLegs !== 'Sentry Bot' && unit[1] !== 'Sentry Bot';
}
// Simplifications flagged to the user: Robobrain Arms' "2 Pistol/Melee OR 1 Rifle" and Sentry Bot
// torso's "2 Heavy OR 2 Heavy-robot" are both implemented additively (both pools open at once)
// rather than as a strict either/or choice — much simpler to track from held instances alone.
function automatronItemAllowed(itemIdx, member){
  const unit = UNITS_DB[member.unitIdx];
  const headName = unit[1];
  const torso = member.automatronTorso;
  const it = ITEMS_DB[itemIdx];
  const name = it[2], cat = it[1];
  if(ROBOT_UNIVERSAL_ITEM_NAMES.has(name)) return true;
  if(torso === 'Mr Handy' && name === 'Third-Arm Clamp') return true;
  if(headName==='Mr Handy' && torso==='Mr Handy' && member.automatronLegs==='Mr Handy' && name==='Mr Handy Fuel') return true;
  if(headName === 'Robobrain' && name === 'Robobrain Arms') return true;
  const hasRobobrainArms = countHeldItemsMatching(member.id, inst => ITEMS_DB[inst.itemIdx][2]==='Robobrain Arms') > 0;
  const isRoboTagged = !isNonRobotTaggedIdx(itemIdx);
  if(NON_ROBO_WEAPON_CATS.includes(cat) && isRoboTagged){
    const lockHead = AUTOMATRON_HEAD_LOCKED_WEAPONS[name];
    if(lockHead && lockHead !== headName) return false;
    if(hasRobobrainArms && name !== 'Robobrain Laser' && name !== 'Robobrain Mesmetron') return false;
    const maxRobo = 2 + (torso === 'Sentry Bot' ? 2 : 0);
    const used = countHeldItemsMatching(member.id, inst =>
      NON_ROBO_WEAPON_CATS.includes(ITEMS_DB[inst.itemIdx][1]) && !isNonRobotTaggedIdx(inst.itemIdx));
    return used < maxRobo;
  }
  if(['Pistol','Melee','Thrown'].includes(cat) && !isRoboTagged){
    const maxSlots = 1 + (torso === 'Mr Handy' ? 1 : 0) + (hasRobobrainArms ? 2 : 0);
    const used = countHeldItemsMatching(member.id, inst => {
      const oi = ITEMS_DB[inst.itemIdx];
      return ['Pistol','Melee','Thrown'].includes(oi[1]) && isNonRobotTaggedIdx(inst.itemIdx);
    });
    return used < maxSlots;
  }
  if(cat === 'Rifle' && !isRoboTagged && hasRobobrainArms){
    const used = countHeldItemsMatching(member.id, inst => ITEMS_DB[inst.itemIdx][1]==='Rifle' && isNonRobotTaggedIdx(inst.itemIdx));
    return used < 1;
  }
  return false;
}
function itemAllowedForMember(itemIdx, member, specialTag){
  if(member && isAutomatronHeadIdx(member.unitIdx)) return automatronItemAllowed(itemIdx, member);
  if(specialTag === 'robot' && member) return robotItemAllowed(itemIdx, member);
  return itemAllowedForTag(itemIdx, specialTag);
}
// Their character object splits equipment by our category (it[1]) into two shapes: carry_slots
// (armor/weapons) want an ARRAY of slugs, consumable_slots (chems/food/gear/etc) want a

const WW_CONSUMABLE_SLOT_BY_CATEGORY = {

function buildWastelandWorkshopExport(){
  const skipped = [];

  const chars = [];
  members.forEach(m=>{
    if(m.unitIdx===null || m.unitIdx===undefined) return;
    const unit = UNITS_DB[m.unitIdx];
    const unitSlug = UNIT_SLUG_BY_NAME[unit[1]];
    if(!unitSlug){ skipped.push(`Юнит "${m.name || unit[1]}" (${unit[1]}) не найден на сайте — добавьте вручную.`); return; }
    const char = { name: unitSlug, modelCount: 1 };
    const modType = unitModTypeForIdx(m.unitIdx); // 'Robot Mod' | 'Creature Mod' | null
    if(m.heroic){
      char.heroic = modType==='Robot Mod' ? 'clunky' : (modType==='Creature Mod' ? 'wild' : 'heroic');
    }
    if(modType){
      const charMods = (m.mods||[]).map(id=>{
        const inst = state.warehouse.items[id];
        const slug = inst ? MOD_SLUG_BY_IDX[inst.itemIdx] : null;
        if(inst && !slug) skipped.push(`Мод юнита "${ITEMS_DB[inst.itemIdx]?ITEMS_DB[inst.itemIdx][2]:'?'}" у ${unit[1]} не найден на сайте.`);
        return slug;
      }).filter(Boolean);
      if(charMods.length) char.char_mods = charMods;
    } else if(m.perks && m.perks.length){
      const perkSlugs = m.perks.map(idx=>{
        const p = PERKS_DB[idx];
        if(!p) return null;
        const slug = PERK_SLUG_BY_NAME[p[0]];
        if(!slug) skipped.push(`Перк "${p[0]}" у ${unit[1]} не найден на сайте.`);
        return slug;
      }).filter(Boolean);
      if(perkSlugs.length) char.perks = perkSlugs;
    }
    const innateIdxSet = new Set((unit[4]||[]).map(pair=>pair[0]));
    const mods = {};
    itemsHeldBy(m.id).filter(inst=>!isModIdx(inst.itemIdx)).forEach(inst=>{
      const it = ITEMS_DB[inst.itemIdx];
      const itName = it ? it[2] : '?';
      const itSlug = ITEM_SLUG_BY_IDX[inst.itemIdx];
      if(inst.modInstId){
        const modInst = state.warehouse.items[inst.modInstId];
        const modIt = modInst ? ITEMS_DB[modInst.itemIdx] : null;
        const mSlug = modInst ? MOD_SLUG_BY_IDX[modInst.itemIdx] : null;
        if(itSlug && mSlug) mods[itSlug] = mSlug;
        else if(modIt) skipped.push(`Мод "${modIt[2]}" на "${itName}" у ${unit[1]} не перенесён (нет соответствия на сайте).`);
      }
      // Innate ("does carry") items are already baked into the unit's profile on their side —
      // only extra/manually-added items need to be declared. Their site splits equipment into
      // "carry_slots" (armor/weapons — array of slugs, duplicates allowed for multiple copies)
      // and "consumable_slots" (chems/food/gear/etc — {slug: count} dict); mixing these up is
      // what threw "No upgrade X found for type gear" and aborted the whole import mid-list.
      if(!innateIdxSet.has(inst.itemIdx)){
        if(!itSlug){ skipped.push(`Предмет "${itName}" у ${unit[1]} не найден на сайте.`); return; }
        const carrySlot = WW_CARRY_SLOT_BY_CATEGORY[it[1]];
        const consumableSlot = WW_CONSUMABLE_SLOT_BY_CATEGORY[it[1]];
        if(carrySlot){
          if(!char[carrySlot]) char[carrySlot] = [];
          char[carrySlot].push(itSlug);
        } else if(consumableSlot){
          if(!char[consumableSlot]) char[consumableSlot] = {};
          char[consumableSlot][itSlug] = (char[consumableSlot][itSlug] || 0) + 1;
        } else {
          skipped.push(`Предмет "${itName}" (категория "${it[1]}") у ${unit[1]} не перенесён — нет подходящего слота на сайте.`);
        }
      }
    });
    if(Object.keys(mods).length) char.mods = mods;
    chars.push(char);
  });
  return { chars, skipped };
}
// Their faction-filter codes (from builder.js's possibleFilters), keyed by our UNITS_DB faction
// strings — purely a display convenience on their end (pre-checks the filter), not required for
// correct import, so factions with no clean equivalent (Neutrals, Wild Wasteland, Raiders — we

// at full Endurance regardless of which of the 3 call sites (Warehouse "add", edit-mode direct
// grant, or a unit's innate "does carry" grant) created it.
function makeItemInstance(id, itemIdx, holder){
  const inst = { id, itemIdx, holder };
  console.log("Создаём предмет:", ITEMS_DB[itemIdx]);
  if(isPowerArmorIdx(itemIdx)){
    const it = ITEMS_DB[itemIdx];
        console.log("Силовая броня обнаружена");
        console.log("Название:", it[2]);
        console.log("Прочность:", POWER_ARMOR_MAX_DURABILITY[it[2]]);
    inst.paCondition = 'Undamaged';
    inst.paDurability = POWER_ARMOR_MAX_DURABILITY[it[2]] || 0;
  }

function addWarehouseItem(itemIdxStr){
  if(itemIdxStr === '') return;
  const id = state.warehouse.nextInstId++;

function deleteWarehouseItem(instId){
  const inst = state.warehouse.items[instId];
  if(inst && inst.modInstId){
    const mod = state.warehouse.items[inst.modInstId];
    if(mod) mod.holder = 'warehouse';
  }
  // if the deleted instance is itself a mod, clear any dangling reference to it
  Object.values(state.warehouse.items).forEach(other=>{
    if(other.modInstId === instId) delete other.modInstId;
  });
  Object.values(state.squad.members).forEach(m=>{
    if(m.mods){ const pos = m.mods.indexOf(instId); if(pos>=0) m.mods.splice(pos,1); }
  });
  delete state.warehouse.items[instId];
  saveState();
  render();
  toast('Предмет убран со склада.');
}
function assignItemToMember(instId, memberId){

// Includes the member's own #id — two unnamed members with the same Unit would otherwise get
// an identical label and their items would visually merge into one group below.
function memberLabel(memberId){
  const m = state.squad.members[memberId];
  if(!m) return `#${memberId}`;
  const unit = (m.unitIdx!==null && m.unitIdx!==undefined) ? UNITS_DB[m.unitIdx] : null;
  return `#${m.id} ${m.name || (unit ? unit[1] : 'без имени')}`;
}
// Options for a member's "add item" select: every instance NOT already held by this member
// (i.e. sitting in the Warehouse, or currently held by some other member) — GROUPED by current
// holder (Warehouse first, then each other member, both amber-highlighted via .combo-group) so
// it's obvious at a glance where an item is coming from — much easier to scan than one long
// merged list, especially once duplicates of the same item name pile up across different owners.
function memberItemPoolOptionsHtml(excludeMemberId){
  const member = state.squad.members[excludeMemberId];
  const specialTag = member ? memberSpecialTag(member.unitIdx) : null;
  // Mods are excluded here — they're attached via their host item's own "+Мод" picker
  // (or, for Robot/Creature units, the unit's own mod slot), not handed out as loose items.
  // Robot/Creature/Dog can only carry their own small explicit item pool (see ITEM_TAG_DEFS);
  // ordinary members are likewise blocked from that species-only gear.
  const pool = Object.values(state.warehouse.items).filter(i =>
    i.holder !== excludeMemberId && !isModIdx(i.itemIdx) && itemAllowedForMember(i.itemIdx, member, specialTag));
  let html = `<option value="">— добавить предмет —</option>`;
  const WAREHOUSE_LABEL = 'Склад';
  const groups = new Map(); // holder label -> [instance,...]
  pool.forEach(inst=>{
    const label = inst.holder === 'warehouse' ? WAREHOUSE_LABEL : memberLabel(inst.holder);
    if(!groups.has(label)) groups.set(label, []);
    groups.get(label).push(inst);
  });
  const orderedLabels = [...groups.keys()].sort((a,b)=>{
    if(a===WAREHOUSE_LABEL) return -1;
    if(b===WAREHOUSE_LABEL) return 1;
    return a.localeCompare(b, 'ru');
  });
  for(const label of orderedLabels){
    const insts = groups.get(label).sort((a,b)=>{
      const an = ITEMS_DB[a.itemIdx] ? ITEMS_DB[a.itemIdx][2] : '';
      const bn = ITEMS_DB[b.itemIdx] ? ITEMS_DB[b.itemIdx][2] : '';
      return an.localeCompare(bn, 'ru');
    });
    const opts = insts.map(inst=>{
      const it = ITEMS_DB[inst.itemIdx];
      return it ? `<option value="${inst.id}">${it[2]} (${it[3]})</option>` : '';
    }).join('');
    html += `<optgroup label="${label.replace(/"/g,'&quot;')}">${opts}</optgroup>`;
  }
  if(!pool.length){
    html += `<option value="" disabled>— склад пуст —</option>`;
  }
  // Edit mode: lets players outfit a unit straight from the full catalog during initial squad
  // setup, without first parking every item in the Warehouse and then redistributing it.
  // Value is prefixed "new:" so the additem handler knows to mint a fresh instance instead of
  // reassigning an existing one — see createItemForMember().
  if(state.editMode){
    const allowedNew = ITEMS_DB.map((it,i)=>({it,i})).filter(x=>x.it[1]!=='Mod' && !HIDDEN_ITEM_INDICES.has(x.i) && itemAllowedForMember(x.i, member, specialTag));
    const catGroups = [...new Set(allowedNew.map(x=>x.it[0]))];
    for(const g of catGroups){
      const opts = allowedNew.filter(x=>x.it[0]===g)
        .map(x=>`<option value="new:${x.i}">${x.it[2]}${x.it[4]?(' ['+x.it[4]+']'):''} — ${x.it[3]}</option>`).join('');
      html += `<optgroup label="${g} — новый, в обход склада">${opts}</optgroup>`;
    }
  }
  return html;
}
// Edit mode only: creates a brand new item instance owned directly by this member, skipping the
// Warehouse "parking" step — for handing a unit its starting gear in one click during setup.
function createItemForMember(memberId, itemIdx){
  const id = state.warehouse.nextInstId++;
  state.warehouse.items[id] = makeItemInstance(id, itemIdx, memberId);
