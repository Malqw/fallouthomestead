/* ---- Power Armor condition/durability repair ---- */
function hasPowerArmorStation(){
  return Object.values(state.structures).some(s => s.name === 'Power Armor Station');
}
function hasArmorerPerk(){
  const armorerIdx = PERKS_DB.findIndex(p => p[0] === 'Armorer');
  if(armorerIdx === -1) return false;
  return Object.values(state.squad.members).some(m=>{
    if(m.perks.includes(armorerIdx)) return true;
    const unit = (m.unitIdx!==null && m.unitIdx!==undefined) ? UNITS_DB[m.unitIdx] : null;
    const innate = unit && unit[3] ? unit[3] : [];
    return innate.includes(armorerIdx);
  });
}
// Book: repairing Power Armor requires a built Power Armor Station AND at least one resident
// with the Armorer perk. Global editMode bypasses both (same as every other cost/requirement).
function canRepairPowerArmor(){
  return !!state.editMode || (hasPowerArmorStation() && hasArmorerPerk());
}
function powerArmorRepairBlockedReason(){
  if(state.editMode) return '';
  if(!hasPowerArmorStation() && !hasArmorerPerk()) return 'нужна Power Armor Station и перк Armorer у бойца';
  if(!hasPowerArmorStation()) return 'нужна построенная Power Armor Station';
  if(!hasArmorerPerk()) return 'нужен перк Armorer у кого-то из бойцов';
  return '';
}
// Damaged -> Undamaged costs 1 Resource. Marking Undamaged -> Damaged (recording battle results,
// since this tool doesn't simulate battles) is free — see markPowerArmorDamaged().
function repairPowerArmorCondition(instId){
  const inst = state.warehouse.items[instId];
  if(!inst || inst.paCondition !== 'Damaged') return;
  if(!canRepairPowerArmor()){ toast(`Нельзя починить: ${powerArmorRepairBlockedReason()}.`, true); return; }
  if(!state.editMode){
    if(state.resources.resource < 1){ toast('Не хватает Ресурса на ремонт состояния (нужно 1).', true); return; }
    state.resources.resource -= 1;
  }
  inst.paCondition = 'Undamaged';
  saveState();
  render();
  toast(`Состояние силовой брони восстановлено${state.editMode?'':' (−1 Ресурс)'}.`);
}
function markPowerArmorDamaged(instId){
  const inst = state.warehouse.items[instId];
  if(!inst) return;
  inst.paCondition = 'Damaged';
  saveState();
  render();
}
// 1 point of Endurance costs 20% of the armor's Caps cost, rounded up. Only while Undamaged.
function repairPowerArmorDurability(instId){
  const inst = state.warehouse.items[instId];
  if(!inst) return;
  const it = ITEMS_DB[inst.itemIdx];
  if(!it) return;
  const max = POWER_ARMOR_MAX_DURABILITY[it[2]] || 0;
  if(inst.paCondition !== 'Undamaged'){ toast('Сначала восстановите состояние брони.', true); return; }
  if(inst.paDurability >= max) return;
  if(!canRepairPowerArmor()){ toast(`Нельзя починить: ${powerArmorRepairBlockedReason()}.`, true); return; }
  const cost = Math.ceil(it[3] * 0.2);
  if(!state.editMode){
    if(state.resources.caps < cost){ toast(`Не хватает крышек на ремонт: нужно ${cost}.`, true); return; }
    state.resources.caps -= cost;
  }
  inst.paDurability += 1;
  saveState();
  render();
  toast(`Выносливость +1${state.editMode?'':` (−${cost} крышек)`}.`);
}
function adjustPowerArmorDurability(instId, delta){
  const inst = state.warehouse.items[instId];
  if(!inst) return;
  const it = ITEMS_DB[inst.itemIdx];
  const max = it ? (POWER_ARMOR_MAX_DURABILITY[it[2]] || 0) : 0;
  inst.paDurability = Math.max(0, Math.min(max, (inst.paDurability||0) + delta));
  saveState();
  render();
}
// Shared by renderSquadView (member Items) and renderWarehouseView (stock list): a normal item
// renders as the usual compact .tag; a Power Armor instance renders as a richer bordered card
// with condition (name colour) + Endurance + repair/damage controls. `removeAttr` is the raw
// attribute string for whichever "take this off" action applies in that context
// (data-removeitem=".." to return to Warehouse, or data-delwarehouse=".." to delete for good).
// Small "🃏" icon rendered next to a unit/item/perk name where physical card art exists (see the
// UNIT_CARD_BY_NAME/ITEM_CARD_BY_NAME/PERK_CARD_BY_NAME lookups near PERKS_DB) — clicking it opens
// openCardLightbox() with that art. Returns '' when there's no matching card, so callers can just
// splice this into a template without an extra existence check.
function cardBtnHtml(name, map){
  const val = map && map[name];
  if(!val) return '';
  const files = Array.isArray(val) ? val : [val];
  const paths = files.map(f=>'cards-web/'+f).join('|');
  return `<span class="card-btn" data-cards="${paths}" title="Показать карт${files.length>1?'ы':'у'}">🃏</span>`;
}
function itemChipHtml(inst, removeAttr, locked){
  const it = ITEMS_DB[inst.itemIdx];
  const removeHtml = locked
    ? `<span class="small-note" title="Врождённый предмет юнита — нельзя убрать" style="color:var(--green-dim);">🔒</span>`
    : `<b ${removeAttr}>✕</b>`;
  if(!it) return `<span class="tag">? ${removeHtml}</span>`;
  const cardBtn = cardBtnHtml(it[2], ITEM_CARD_BY_NAME);
  if(it[2] === 'Fusion Core'){
    const canAdd = canAddFusionCoreCharge();
    const addTitle = canAdd ? '' : ` title="${fusionCoreBlockedReason()}"`;
    return `<div class="armor-card">
      <div class="armor-name" style="color:var(--green);">${it[2]} (${it[3]}) ${cardBtn}</div>
      <div class="armor-stats">Заряды: ${inst.charges}/${FUSION_CORE_MAX_CHARGES}</div>
      <div class="armor-actions">
        <button class="ghost" data-usecharge="${inst.id}" ${inst.charges<=0?'disabled':''}>−1 заряд</button>
        <button data-addcharge="${inst.id}" ${(!canAdd || inst.charges>=FUSION_CORE_MAX_CHARGES)?'disabled':''}${addTitle}>+1 заряд</button>
        ${removeHtml}
      </div>
    </div>`;
  }
  if(it[1] !== 'Power Armor'){
    const slot = modSlotForCategory(it[1]);
    if(!slot){
      return `<span class="tag">${it[2]} (${it[3]}) ${cardBtn} ${removeHtml}</span>`;
    }
    return `<div class="armor-card">
      <div class="armor-name" style="color:var(--green);">${it[2]} (${it[3]}) ${cardBtn}</div>
      <div class="armor-actions">
        ${modSlotHtml(inst)}
        ${removeHtml}
      </div>
    </div>`;
  }
  const max = POWER_ARMOR_MAX_DURABILITY[it[2]] || 0;
  const dmg = inst.paCondition === 'Damaged';
  const nameColor = dmg ? 'var(--amber)' : 'var(--green)';
  const canRepair = canRepairPowerArmor();
  const blockedTitle = canRepair ? '' : ` title="${powerArmorRepairBlockedReason()}"`;
  let actionBtn;
  if(dmg){
    actionBtn = `<button data-repaircond="${inst.id}" ${canRepair?'':'disabled'}${blockedTitle}>Починить состояние (1 Ресурс)</button>`;
  } else if(inst.paDurability < max){
    const cost = Math.ceil(it[3]*0.2);
    actionBtn = `<button data-repairdur="${inst.id}" ${canRepair?'':'disabled'}${blockedTitle}>+1 Выносливость (${cost} кр.)</button>`;
  } else {
    actionBtn = '';
  }
  return `<div class="armor-card">
    <div class="armor-name" style="color:${nameColor};">${it[2]} (${it[3]}) ${cardBtn}</div>
    <div class="armor-stats">${inst.paCondition} · Выносливость ${inst.paDurability}/${max}</div>
    <div class="armor-actions">
      
      ${actionBtn}
    ${state.editMode ? `
      <button class="ghost" data-adjustdur="${inst.id}" data-delta="-1" title="Записать потерю выносливости (бесплатно)">−1 Вын.</button>
      ${!dmg ? `<button class="ghost" data-markdamaged="${inst.id}" title="Отметить повреждённой после боя (бесплатно)">Повредить</button>` : ''}
    ` : ''}
      ${modSlotHtml(inst)}
      ${removeHtml}
    </div>
  </div>`;
}
// Wires the buttons rendered by itemChipHtml() — shared by attachSquadEvents() and
// attachWarehouseEvents() since a Power Armor card can appear in either view.
function attachArmorControls(root){
  root.querySelectorAll('[data-usecharge]').forEach(b=>{
    b.onclick = ()=> useFusionCoreCharge(Number(b.dataset.usecharge));
  });
  root.querySelectorAll('[data-addcharge]').forEach(b=>{
    b.onclick = ()=> addFusionCoreCharge(Number(b.dataset.addcharge));
  });
  root.querySelectorAll('[data-repaircond]').forEach(b=>{
    b.onclick = ()=> repairPowerArmorCondition(Number(b.dataset.repaircond));
  });
  root.querySelectorAll('[data-repairdur]').forEach(b=>{
    b.onclick = ()=> repairPowerArmorDurability(Number(b.dataset.repairdur));
  });
  root.querySelectorAll('[data-markdamaged]').forEach(b=>{
    b.onclick = ()=> markPowerArmorDamaged(Number(b.dataset.markdamaged));
  });
  root.querySelectorAll('[data-adjustdur]').forEach(b=>{
    b.onclick = ()=> adjustPowerArmorDurability(Number(b.dataset.adjustdur), Number(b.dataset.delta));
  });
  root.querySelectorAll('[data-attachmod]').forEach(b=>{
    b.onclick = ()=>{
      const hostId = Number(b.dataset.attachmod);
      const sel = root.querySelector(`[data-modselect="${hostId}"]`);
      if(!sel || !sel.value){ toast('Выберите мод из списка.', true); return; }
      attachModValue(hostId, sel.value);
    };
  });
  root.querySelectorAll('[data-detachmod]').forEach(b=>{
    b.onclick = ()=> detachMod(Number(b.dataset.detachmod));
  });
}
// One-time migration for saves made before Items became warehouse-backed instances: each
// member.items[] of raw ITEMS_DB indices becomes an owned instance in the shared warehouse pool.
// Idempotent — safe to call on every load, does nothing once already migrated.
function migrateSquadItems(){
  if(!state.warehouse) state.warehouse = { nextInstId: 1, items: {} };
  // Two separate edit-mode flags (squad.editMode, top-level buildEditMode) got unified into one
  // global state.editMode — fold whichever old flag(s) a save has into the new one and drop them.
  if(state.editMode === undefined){
    state.editMode = !!(state.squad.editMode || state.buildEditMode);
  }
  delete state.squad.editMode;
  delete state.buildEditMode;
  Object.values(state.squad.members).forEach(m=>{
    if(m.mission === undefined) m.mission = false;
    if(m.heroic === undefined) m.heroic = false;
    if(m.leaderPerk === undefined) m.leaderPerk = null;
    if(!m.grantedInnateForUnits) m.grantedInnateForUnits = [];
    if(Array.isArray(m.items)){
      m.items.forEach(itemIdx=>{
        const id = state.warehouse.nextInstId++;
        state.warehouse.items[id] = makeItemInstance(id, itemIdx, m.id);
      });
      delete m.items;
    }
  });
  // Saves from before Power Armor got condition/durability tracking: back-fill as if the suit
  // had always been in good repair (Undamaged, full Endurance) rather than guessing damage.
  Object.values(state.warehouse.items).forEach(inst=>{
    if(isPowerArmorIdx(inst.itemIdx) && inst.paCondition === undefined){
      const it = ITEMS_DB[inst.itemIdx];
      inst.paCondition = 'Undamaged';
      inst.paDurability = POWER_ARMOR_MAX_DURABILITY[it[2]] || 0;
    }
    if(isFusionCoreIdx(inst.itemIdx) && inst.charges === undefined){
      inst.charges = FUSION_CORE_MAX_CHARGES;
    }
  });
}

/* ============================= HELPERS ============================= */
function ck(r,c){ return r+","+c; }
function zoneOf(r,c){
  // 0-indexed rows/cols 0..35
  if(r>=9 && r<=26 && c>=9 && c<=26) return 1;   // 18x18
  if(r>=6 && r<=29 && c>=6 && c<=29) return 2;   // 24x24
  if(r>=3 && r<=32 && c>=3 && c<=32) return 3;   // 30x30
  return 4;                                       // 36x36
}
const ZONE_COLORS = {1:"#173a52",2:"#2c3d1f",3:"#25320f",4:"#171e0a"};
const ZONE_NAMES = {1:"Стартовая (18x18)",2:"+1 Land (24x24)",3:"+2 Land (30x30)",4:"+3 Land (36x36)"};

function isOccupied(r,c){ return state.cells[ck(r,c)] !== undefined; }
// A Small Structure is meant to sit INSIDE its parent's footprint, so a cell that already
// belongs to the designated parent container is fine — only cells belonging to something
// ELSE (or already claimed by a sibling Small Structure, whose own cells overwrite the
// parent's mark there once placed) are genuinely blocked.
function cellAvailableForSmall(r,c,parentId){
  const occ = state.cells[ck(r,c)];
  if(occ === undefined) return true;
  if(parentId && String(occ) === String(parentId)) return true;
  return false;
}
function structureAt(r,c){
  const id = state.cells[ck(r,c)];
  return id ? state.structures[id] : null;
}
function connectorAt(r,c){
  return state.connectors.find(cn => cn.cells.some(([rr,cc])=>rr===r&&cc===c));
}

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = isErr ? 'var(--red)' : 'var(--green)';
  t.style.color = isErr ? 'var(--red)' : 'var(--green)';
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ============================= VALIDATION ============================= */
function boundingBox(cellsSet){
  let minR=Infinity,maxR=-Infinity,minC=Infinity,maxC=-Infinity;
  for(const key of cellsSet){
    const [r,c] = key.split(',').map(Number);
    if(r<minR)minR=r; if(r>maxR)maxR=r;
    if(c<minC)minC=c; if(c>maxC)maxC=c;
  }
  return {minR,maxR,minC,maxC};
}

function isConnected(cellsSet){
  if(cellsSet.size===0) return true;
  const arr = [...cellsSet];
  const visited = new Set([arr[0]]);
  const stack = [arr[0]];
  while(stack.length){
    const cur = stack.pop();
    const [r,c] = cur.split(',').map(Number);
    for(const [dr,dc] of [[0,1],[0,-1],[1,0],[-1,0]]){
      const nk = ck(r+dr,c+dc);
      if(cellsSet.has(nk) && !visited.has(nk)){ visited.add(nk); stack.push(nk); }
    }
  }
  return visited.size === cellsSet.size;
}

// Exact rule check: "single-square wide corridors or protrusions are not allowed" ==
// every cell must be part of at least one fully-filled 2x2 block within the shape.
function checkWidthTwoEverywhere(cellsSet){
  const bad = [];
  for(const key of cellsSet){
    const [r,c] = key.split(',').map(Number);
    const quads = [
      [[r,c],[r,c+1],[r+1,c],[r+1,c+1]],
      [[r,c-1],[r,c],[r+1,c-1],[r+1,c]],
      [[r-1,c],[r-1,c+1],[r,c],[r,c+1]],
      [[r-1,c-1],[r-1,c],[r,c-1],[r,c]],
    ];
    const ok = quads.some(q => q.every(([rr,cc]) => cellsSet.has(ck(rr,cc))));
    if(!ok) bad.push(key);
  }
  return bad;
}

// Full geometric validation against the official shape table (p.9):
// size 1 -> 1x1, size 2 -> 2x1, size 4 -> 2x2, size 6 -> 3x2 (rotations allowed),
// size 8+ -> any connected shape with width >= 2 everywhere.
function validateShapeGeometry(cellsSet, size){
  const errors = [];
  if(cellsSet.size===0) return errors;

  if(!isConnected(cellsSet)){
    errors.push('Форма должна быть цельной — сейчас клетки образуют отдельные "острова", не соединённые сторонами.');
    return errors;
  }

  const fixedShapes = {1:[1,1], 2:[1,2], 4:[2,2], 6:[2,3]};
  const sz = Number(size);
  if(fixedShapes[sz]){
    const [ha,hb] = fixedShapes[sz];
    const {minR,maxR,minC,maxC} = boundingBox(cellsSet);
    const h = maxR-minR+1, w = maxC-minC+1;
    const dims = [h,w].sort((a,b)=>a-b);
    const expected = [ha,hb].sort((a,b)=>a-b);
    const rectFilled = cellsSet.size === h*w;
    const dimsMatch = dims[0]===expected[0] && dims[1]===expected[1];
    if(!rectFilled || !dimsMatch){
      errors.push(`Для размера ${sz} форма по правилам должна быть прямоугольником ${ha}x${hb} (можно повернуть на 90°), без вырезов и выступов.`);
    }
  } else if(sz >= 8){
    const badWidth = checkWidthTwoEverywhere(cellsSet);
    if(badWidth.length){
      errors.push(`Ширина формы менее 2 клеток в отдельных местах (однослойные коридоры/выступы запрещены правилами, стр.9). Проблемные клетки: ${badWidth.map(k=>{const[r,c]=k.split(',');return `${+r+1},${+c+1}`;}).join('; ')}`);
    }
  }
  return errors;
}

function chebyshevMinDist(cellsA, cellsB){
  let min = Infinity;
  for(const a of cellsA){
    const [ar,ac] = a.split(',').map(Number);
    for(const b of cellsB){
      const [br,bc] = b.split(',').map(Number);
      const d = Math.max(Math.abs(ar-br), Math.abs(ac-bc));
      if(d<min) min=d;
    }
  }
  return min;
}

// Which Structure types can contain Small Structures, and what they accept (p.3-9):
// Hut/Shelter/Lodge accept any Small Structure except Cooking Station; Barracks accepts
// only Boost Structures. Matched by name so both DB-picked and custom-named structures work.
function containerAcceptance(structName){
  const n = (structName||'').trim().toLowerCase();
  if(n==='hut' || n==='shelter' || n==='lodge') return 'any-except-cooking';
  if(n==='barracks') return 'boost-only';
  return null; // not a container type at all
}
// The STRUCTURES_DB category of whatever the draft currently represents (null if a fully
// custom/manually-typed structure, since we can't know its category then).
function draftCategory(structIndex){
  if(structIndex !== undefined && structIndex !== ''){
    const item = STRUCTURES_DB[Number(structIndex)];
    return item ? item.cat : null;
  }
  return null;
}
function draftIsCookingStation(structIndex, name){
  if(structIndex !== undefined && structIndex !== ''){
    const item = STRUCTURES_DB[Number(structIndex)];
    return !!(item && item.name === 'Cooking Station');
  }
  return (name||'').trim().toLowerCase() === 'cooking station';
}
// All existing structures on the map that could legally contain the small structure currently
// being drafted, given its category (Boost vs. everything else) and whether it's a Cooking Station.
function eligibleParents(structIndex, name){
  const cat = draftCategory(structIndex);
  const isCooking = draftIsCookingStation(structIndex, name);
  return Object.values(state.structures).filter(s=>{
    if(s.small) return false; // a container itself is never a Small Structure
    const acc = containerAcceptance(s.name);
    if(!acc) return false;
    if(acc==='boost-only') return cat==='Boost';
    return !isCooking; // 'any-except-cooking'
  });
}

function validateDraft(cellsSet, meta){
  const errors = [];
  const cellArr = [...cellsSet];

  // overlap / bounds / land-level
  const parentForOverlap = meta.small ? meta.parent : '';
  for(const key of cellArr){
    const [r,c] = key.split(',').map(Number);
    if(!cellAvailableForSmall(r,c,parentForOverlap)) errors.push(`Клетка ${r+1},${c+1} уже занята другой постройкой.`);
    if(zoneOf(r,c) > state.landLevel) errors.push(`Клетка ${r+1},${c+1} вне открытой территории Land (уровень ${state.landLevel}).`);
  }

  // size vs declared
  if(meta.size && cellArr.length !== Number(meta.size)){
    errors.push(`Заявленный размер ${meta.size}, но выделено клеток: ${cellArr.length}.`);
  }

  // full shape geometry per rulebook (connectivity + fixed shapes / min-width-2 for 8+)
  errors.push(...validateShapeGeometry(cellsSet, meta.size || cellArr.length));

  // max-count limit for structure types that have one (Crop Field, Brahmin Ranch, etc.)
  // + Caps affordability (skipped for custom/manual structures, ambiguous-formula costs like
  // Turret/Boost, and while global editMode is on — see parseStructureCapsCost()).
  if(meta.structIndex !== undefined && meta.structIndex !== ''){
    const item = STRUCTURES_DB[Number(meta.structIndex)];
    if(item && item.max){
      const count = Object.values(state.structures).filter(s=>s.name===item.name).length;
      if(count >= item.max){
        errors.push(`Лимит построек: "${item.name}" можно построить не более ${item.max} шт. (уже построено: ${count}).`);
      }
    }
    if(item && !state.editMode){
      const cost = parseStructureCapsCost(item.cost);
      if(cost !== null && cost > state.resources.caps){
        errors.push(`Не хватает крышек: нужно ${cost}, в наличии ${state.resources.caps}.`);
      }
    }
  }

  // container-type compatibility (Hut/Shelter/Lodge accept any Small Structure except Cooking
  // Station; Barracks accepts only Boost Structures) — the dropdown only offers valid options,
  // this is just a safety net in case the container was deleted/changed after being selected.
  if(meta.small && meta.parent){
    const parentStruct = state.structures[meta.parent];
    if(!parentStruct){
      errors.push(`Постройка-контейнер #${meta.parent} больше не существует — выберите другую.`);
    } else {
      const acc = containerAcceptance(parentStruct.name);
      if(!acc){
        errors.push(`Постройка #${meta.parent} (${parentStruct.name}) не принимает малые постройки внутрь.`);
      } else if(acc==='boost-only' && meta.cat!=='Boost'){
        errors.push(`Barracks может содержать только постройки типа Boost.`);
      } else if(acc==='any-except-cooking' && meta.isCooking){
        errors.push(`Cooking Station нельзя размещать внутри Hut/Shelter/Lodge (искл. по правилам, стр.4).`);
      }
    }
  }

  // distance to other structures
  if(!meta.small){
    for(const id in state.structures){
      const other = state.structures[id];
      if(other.small) continue;
      const isWatch = /watch tower/i.test(meta.name) && /watch tower/i.test(other.name);
      const minGap = isWatch ? 9 : 3; // Chebyshev distance; 3 = Orange(2 empty squares), 9 = Green(8 squares)
      const otherKeys = other.cells.map(([r,c])=>ck(r,c));
      const d = chebyshevMinDist(cellArr, otherKeys);
      if(d < minGap){
        const label = isWatch ? "Green (8 клеток)" : "Orange (2 клетки)";
        errors.push(`Слишком близко к постройке #${other.id} (${other.name}) — нужно минимум ${label} между ними.`);
      }
    }
  }

  return errors;
}

/* ============================= ACTIONS ============================= */
function startDraft(){
  draft = { cells: new Set() };
  render();
}
function cancelDraft(){
  draft = null;
  draftMeta = { structIndex:'', name:'', size:4, doors:1, small:false, parent:'' };
  render();
}
function toggleDraftCell(r,c){
  if(!draft) return;
  const key = ck(r,c);
  if(draft.cells.has(key)){ draft.cells.delete(key); return; }
  const parentId = draftMeta.small ? draftMeta.parent : '';
  if(!cellAvailableForSmall(r,c,parentId)){ toast('Клетка уже занята', true); return; }
  if(zoneOf(r,c) > state.landLevel){ toast('Клетка вне открытой территории Land', true); return; }
  draft.cells.add(key);
}

function saveDraft(){
  const name = (draftMeta.name || '').trim() || 'Structure';
  const size = draftMeta.size;
  const doors = Number(draftMeta.doors || 0);
  const small = !!draftMeta.small;
  const parent = (draftMeta.parent || '').trim();

  if(!draft || draft.cells.size===0){ toast('Сначала выделите клетки на поле', true); return; }

  const errors = validateDraft(draft.cells, {
    name, size, small, structIndex: draftMeta.structIndex, parent,
    cat: draftCategory(draftMeta.structIndex),
    isCooking: draftIsCookingStation(draftMeta.structIndex, name),
  });
  const box = document.getElementById('validationBox');
  if(errors.length){
    if(box){ box.className = 'errbox'; box.textContent = '⚠ ' + errors.join('\n⚠ '); }
    return;
  }
  if(box){ box.className = 'okbox'; box.textContent = '✓ Форма прошла проверку.'; }

  const id = state.nextId++;
  const color = PALETTE[(id-1) % PALETTE.length];
  const cellArr = [...draft.cells].map(k=>k.split(',').map(Number));
  state.structures[id] = {
    id, name, size: Number(size)||cellArr.length, doors, small, parent,
    status: 'Undamaged', reinforced: false, color, cells: cellArr, doorEdges: []
  };
  cellArr.forEach(([r,c]) => state.cells[ck(r,c)] = id);

  // Charge Caps for book structures with a plain numeric cost — Turret/Boost (ambiguous formula
  // cost) and fully custom/manual structures are never auto-charged, and global editMode makes
  // everything free (already enforced above in validateDraft, this just skips the deduction too).
  let costNote = '';
  if(draftMeta.structIndex !== '' && !state.editMode){
    const item = STRUCTURES_DB[Number(draftMeta.structIndex)];
    const cost = item ? parseStructureCapsCost(item.cost) : null;
    if(cost){
      state.resources.caps -= cost;
      costNote = ` (−${cost} крышек)`;
    }
  }

  draft = null;
  draftMeta = { structIndex:'', name:'', size:4, doors:1, small:false, parent:'' };
  saveState();
  render();
  toast(`Постройка #${id} "${name}" добавлена.${costNote}`);
}

function deleteStructure(id){
  const s = state.structures[id];
  if(!s) return;
  const parentId = s.small && s.parent && state.structures[s.parent] ? Number(s.parent) : null;
  s.cells.forEach(([r,c])=>{
    if(parentId) state.cells[ck(r,c)] = parentId;
    else delete state.cells[ck(r,c)];
  });
  delete state.structures[id];
  if(inspectSelectedId===id) inspectSelectedId=null;
  saveState();
  render();
  toast(`Постройка #${id} удалена.`);
}

function updateStructureField(id, field, value){
  const s = state.structures[id];
  if(!s) return;
  s[field] = value;
  saveState();
  render();
}

/* ---- edges: fences / barricades / ladders (vertex-to-vertex, diagonals allowed) ---- */
function nearestVertex(px, py, cellSize){
  const gx = px/cellSize, gy = py/cellSize;
  const r = Math.max(0, Math.min(GRID, Math.round(gy)));
  const c = Math.max(0, Math.min(GRID, Math.round(gx)));
  return {r,c};
}
function vertexEdgeKey(p1,p2){
  let a=p1, b=p2;
  if(a.r>b.r || (a.r===b.r && a.c>b.c)){ const t=a; a=b; b=t; }
  return `${a.r},${a.c}|${b.r},${b.c}`;
}
function isAdjacentVertex(p1,p2){
  const dr = Math.abs(p1.r-p2.r), dc = Math.abs(p1.c-p2.c);
  return dr<=1 && dc<=1 && !(dr===0 && dc===0);
}
// migrates edges saved in the old cell-border format ("h:r:c" / "v:r:c") to the
// new vertex-pair format ("r1,c1|r2,c2") so previously saved JSON keeps working.
function migrateEdges(edges){
  const migrated = {};
  for(const key in edges){
    if(key.includes('|')){ migrated[key] = edges[key]; continue; }
    const [type, rStr, cStr] = key.split(':');
    const r = Number(rStr), c = Number(cStr);
    const p1 = {r,c};
    const p2 = type==='h' ? {r, c:c+1} : {r:r+1, c};
    migrated[vertexEdgeKey(p1,p2)] = edges[key];
  }
  return migrated;
}

/* Which two cells a segment runs between (used only for the "inside a structure" interior-wall check
   and for the min-gap distance when a segment does NOT touch anything).
   Orthogonal segments border exactly 2 cells (one each side); a diagonal segment
   is the diagonal of exactly one grid cell (the square it cuts across). */
function edgeTouchedCells(p1,p2){
  const dr = p2.r-p1.r, dc = p2.c-p1.c;
  if(dr===0){
    const c = Math.min(p1.c,p2.c);
    return {type:'ortho', cells:[{r:p1.r-1,c},{r:p1.r,c}]};
  }
  if(dc===0){
    const r = Math.min(p1.r,p2.r);
    return {type:'ortho', cells:[{r,c:p1.c-1},{r,c:p1.c}]};
  }
  const r = Math.min(p1.r,p2.r), c = Math.min(p1.c,p2.c);
  return {type:'diag', cells:[{r,c}]};
}
function cellStructId(r,c){ return state.cells[ck(r,c)]; }

// "Touching" per the rulebook means the fence shares so much as a POINT with the structure —
// not just running parallel along a full wall. A vertex touches a structure if it is a corner
// of any of the (up to 4) grid cells meeting at that vertex and one of those cells is occupied.
function structureIdsAtVertex(v){
  const ids = new Set();
  [[v.r-1,v.c-1],[v.r-1,v.c],[v.r,v.c-1],[v.r,v.c]].forEach(([rr,cc])=>{
    const id = cellStructId(rr,cc);
    if(id!==undefined) ids.add(id);
  });
  return ids;
}
function vertexTouchesAnyStructure(v){ return structureIdsAtVertex(v).size > 0; }
function connectorIdsAtVertex(v){
  const ids = new Set();
  [[v.r-1,v.c-1],[v.r-1,v.c],[v.r,v.c-1],[v.r,v.c]].forEach(([rr,cc])=>{
    const cn = connectorAt(rr,cc);
    if(cn) ids.add(cn.id);
  });
  return ids;
}

function doorBlockedByEdge(p1,p2){
  if(p1.r!==p2.r && p1.c!==p2.c) return false; // a diagonal line can't sit exactly on an orthogonal doorway
  const isHoriz = p1.r===p2.r;
  const doorKey = isHoriz ? `h:${p1.r}:${Math.min(p1.c,p2.c)}` : `v:${Math.min(p1.r,p2.r)}:${p1.c}`;
  return Object.values(state.structures).some(s=>s.doorEdges.includes(doorKey));
}

// Turn-angle rule (p.10): a fence/barricade "may change direction midway by 135º or 90º" and
// "is allowed to touch other Structures/Barricades so long as they do not form any angle of 45º".
// Both statements reduce to the same geometric check: wherever the new segment shares a vertex
// with an EXISTING fence/barricade segment, the angle between them must not be 45°
// (0°/180° = straight through, 90°/135° = allowed turns, 45° = forbidden).
const BEARING = {'0,1':0,'1,1':45,'1,0':90,'1,-1':135,'0,-1':180,'-1,-1':225,'-1,0':270,'-1,1':315};
function bearingOf(from,to){ return BEARING[`${Math.sign(to.r-from.r)},${Math.sign(to.c-from.c)}`]; }
function angleBetweenBearings(b1,b2){ const d=Math.abs(b1-b2)%360; return d>180 ? 360-d : d; }
function edgesAtVertex(v){
  const out = [];
  for(const key in state.edges){
    if(state.edges[key]==='ladder') continue; // this rule only governs fences & barricades
    const [p1s,p2s] = key.split('|');
    const [r1,c1] = p1s.split(',').map(Number);
    const [r2,c2] = p2s.split(',').map(Number);
    if(r1===v.r && c1===v.c) out.push({r:r2,c:c2});
    else if(r2===v.r && c2===v.c) out.push({r:r1,c:c1});
  }
  return out;
}
function checkTurnAngles(p1,p2){
  for(const [vertex,outward] of [[p1,p2],[p2,p1]]){
    const newBearing = bearingOf(vertex, outward);
    for(const other of edgesAtVertex(vertex)){
      const oldBearing = bearingOf(vertex, other);
      // The rule cares about the actual VISIBLE angle between the two segments as drawn at the
      // shared vertex (the angle you'd measure with a protractor between the ray to the new
      // segment's far point and the ray to the existing segment's far point) — not which one is
      // "continuing" which. Allowed values: 180°(straight through)/135°/90°. Forbidden: 45°.
      if(angleBetweenBearings(newBearing, oldBearing) === 45){
        return [`Угол 45° между линиями у точки (${vertex.r+1},${vertex.c+1}): новый сегмент к (${outward.r+1},${outward.c+1}) и существующий сегмент к (${other.r+1},${other.c+1}) — разрешены только 90° или 135° между ними (или прямое продолжение) (стр.10).`];
      }
    }
  }
  return [];
}

// A Structure's own wall(s) at a given vertex: for each of the 4 axis directions from that vertex,
// the 1-square edge in that direction is a "wall" if exactly one of its two flanking cells belongs
// to a Structure (i.e. it's a real boundary edge, not open ground on both sides or inside a Structure).
// Returns the bearing of each such wall-ray (the direction the wall extends AWAY from the vertex).
function structureWallBearingsAtVertex(v){
  const dirs = [{dr:0,dc:1},{dr:0,dc:-1},{dr:1,dc:0},{dr:-1,dc:0}];
  const bearings = [];
  for(const {dr,dc} of dirs){
    const p2 = {r:v.r+dr, c:v.c+dc};
    const {cells} = edgeTouchedCells(v,p2);
    const [a,b] = cells;
    const occA = cellStructId(a.r,a.c)!==undefined, occB = cellStructId(b.r,b.c)!==undefined;
    if(occA !== occB){ bearings.push(bearingOf(v,p2)); }
  }
  return bearings;
}
// All existing fence/barricade edge-keys reachable from a starting vertex by following shared
// vertices (i.e. the whole continuous line/network that vertex is part of, however many links away).
function connectedEdgeKeys(startVertex){
  const visitedVerts = new Set([`${startVertex.r},${startVertex.c}`]);
  const resultKeys = new Set();
  const queue = [startVertex];
  while(queue.length){
    const v = queue.shift();
    for(const key in state.edges){
      if(state.edges[key]==='ladder' || resultKeys.has(key)) continue;
      const [p1s,p2s] = key.split('|');
      const [r1,c1] = p1s.split(',').map(Number);
      const [r2,c2] = p2s.split(',').map(Number);
      let other = null;
      if(r1===v.r && c1===v.c) other = {r:r2,c:c2};
      else if(r2===v.r && c2===v.c) other = {r:r1,c:c1};
      if(other){
        resultKeys.add(key);
        const ok = `${other.r},${other.c}`;
        if(!visitedVerts.has(ok)){ visitedVerts.add(ok); queue.push(other); }
      }
    }
  }
  return resultKeys;
}

// Minimum Chebyshev "cell distance" between the new segment and every EXISTING fence/barricade
// edge that is NOT part of the same connected line as the new segment (a segment continuing an
// already-placed line is exempt from the gap rule against ITS OWN line, however many links away —
// the rule is about gaps between genuinely separate/different fences, not self-proximity of one
// continuous line). Edges directly sharing a vertex are covered by the 45° angle check instead.
function fenceGapDistance(p1, p2, ownCells){
  const sameLine = new Set([...connectedEdgeKeys(p1), ...connectedEdgeKeys(p2)]);
  let minDist = Infinity;
  for(const key in state.edges){
    const kind = state.edges[key];
    if(kind==='ladder' || sameLine.has(key)) continue;
    const [q1s,q2s] = key.split('|');
    const [r1,c1] = q1s.split(',').map(Number);
    const [r2,c2] = q2s.split(',').map(Number);
    const otherCells = new Set(edgeTouchedCells({r:r1,c:c1},{r:r2,c:c2}).cells.map(({r,c})=>ck(r,c)));
    const d = chebyshevMinDist(ownCells, otherCells);
    if(d<minDist) minDist=d;
  }
  return minDist;
}

// Genuine "45° with a Structure" violation (p.10): exactly the same idea as the fence-to-fence
// turn check, but measured against the wall's own direction instead of an existing fence's.
// A diagonal touching a corner is illegal only when it runs at 45° to one of the walls meeting
// there (hugging that wall's direction); the "outward" diagonal, symmetric between two walls
// 90° apart, is 135° from each of them and is explicitly fine.
function checkStructureWallAngles(p1,p2){
  for(const [vertex,outward] of [[p1,p2],[p2,p1]]){
    const newBearing = bearingOf(vertex, outward);
    for(const wallBearing of structureWallBearingsAtVertex(vertex)){
      if(angleBetweenBearings(newBearing, wallBearing) === 45){
        return [`Линия у точки (${vertex.r+1},${vertex.c+1}) образует угол 45° со стеной постройки (идёт вдоль стены, а не в сторону от угла) — запрещено правилами (стр.10).`];
      }
    }
  }
  return [];
}

// Automatic rulebook validation (improvement #3), p.10-11:
// - Fence/Barricade must not be built inside a Structure
// - must not block a doorway
// - the line (and any turn along it) must not form a 45° angle with a touching Structure or with
//   another Fence/Barricade — touching is otherwise fine with zero gap
// - if not touching anything, the gap to the nearest Structure must be at least Orange (2 squares)
// - a Ladder must be orthogonal and must touch a Structure/Walkway/Ramp — not floating in open ground
function validateEdgeSegment(p1, p2, kind){
  const errors = [];
  const isDiagonal = p1.r!==p2.r && p1.c!==p2.c;
  const {type, cells} = edgeTouchedCells(p1,p2);

  if(kind === 'ladder'){
    if(isDiagonal){
      errors.push('Лестницу можно ставить только по прямой линии (без диагонали) — стр.11.');
      return errors;
    }
    if(doorBlockedByEdge(p1,p2)){
      errors.push('Линия перекрывает дверной проём — так нельзя (стр.10).');
    }
    const touchesSomething = vertexTouchesAnyStructure(p1) || vertexTouchesAnyStructure(p2)
      || connectorIdsAtVertex(p1).size>0 || connectorIdsAtVertex(p2).size>0;
    if(!touchesSomething){
      errors.push('Лестницу нужно ставить вдоль стены постройки, Walkway или нижнего конца Ramp — сейчас она ни к чему не примыкает (стр.11).');
    }
    return errors;
  }

  // Fence / Barricade
  // 1. Not built inside a Structure (interior wall / cutting through an occupied cell)
  if(type==='ortho'){
    const [a,b] = cells;
    const idA = cellStructId(a.r,a.c), idB = cellStructId(b.r,b.c);
    if(idA!==undefined && idA===idB){
      errors.push('Нельзя строить внутри постройки — обе стороны линии принадлежат одной и той же постройке (стр.11).');
      return errors;
    }
  } else {
    const [own] = cells;
    if(cellStructId(own.r,own.c)!==undefined){
      errors.push('Диагональная линия проходит через клетку постройки — так нельзя (стр.11).');
      return errors;
    }
  }

  // 2. Doorways
  if(doorBlockedByEdge(p1,p2)){
    errors.push('Линия перекрывает дверной проём — так нельзя (стр.10).');
  }

  // 3. Turn/touch angle vs other fence/barricade lines (covers both the 90°/135° turn rule
  //    and "touching a Barricade at 45°")
  errors.push(...checkTurnAngles(p1,p2));

  // 4. Genuine "45° with a Structure's wall" check (hugging a wall vs. heading cleanly away
  //    from its corner — see checkStructureWallAngles above for the geometry).
  errors.push(...checkStructureWallAngles(p1,p2));

  // 5. Touching a Structure (sharing so much as a point/corner) is allowed with zero gap, and is
  //    already governed by the wall-angle check above. A segment that DOESN'T touch a Structure
  //    still needs the Orange (2-square) minimum gap — UNLESS it's simply continuing a
  //    fence/barricade line that's already placed (validated when it was placed): the gap rule
  //    stops a fresh, free-standing fence starting too close to a building, it doesn't force a
  //    line that's already anchored (e.g. touching a corner) to instantly jump 2 squares away.
  const touchesStructure = vertexTouchesAnyStructure(p1) || vertexTouchesAnyStructure(p2);
  const continuesExistingLine = edgesAtVertex(p1).length>0 || edgesAtVertex(p2).length>0;
  const cellKeys = new Set(cells.map(({r,c})=>ck(r,c)));
  if(!touchesStructure && !continuesExistingLine){
    let minDist = Infinity;
    for(const id in state.structures){
      const s = state.structures[id];
      const d = chebyshevMinDist(cellKeys, new Set(s.cells.map(([r,c])=>ck(r,c))));
      if(d<minDist) minDist=d;
    }
    if(minDist < 3){
      errors.push('Слишком близко к постройке — нужен зазор минимум Orange (2 клетки), либо линия должна касаться постройки хотя бы точкой (стр.10).');
    }
  }

  // 6. The same Orange (2-square) minimum gap rule also applies BETWEEN two separate,
  //    non-touching Fence/Barricade lines — not just between a fence and a Structure.
  //    Segments that share a vertex ("touching") are exempt here too, since that case is governed
  //    by the 45°/turn-angle check above instead.
  const fenceGap = fenceGapDistance(p1, p2, cellKeys);
  if(fenceGap < 3){
    errors.push('Слишком близко к другому забору/барикаде — нужен зазор минимум Orange (2 клетки), либо линии должны касаться друг друга (стр.10).');
  }

  return errors;
}

// Flood-fills all open (non-structure) ground within the current Land level to make sure
// the candidate set of fence/barricade edges doesn't wall off part of the settlement completely
// ("Barricades/Fences must not create a completely enclosed area", p.11).
function wouldEncloseArea(candidateEdges){
  const openCells = [];
  for(let r=0;r<GRID;r++){
    for(let c=0;c<GRID;c++){
      if(zoneOf(r,c) > state.landLevel) continue;
      if(state.cells[ck(r,c)]) continue;
      openCells.push(ck(r,c));
    }
  }
  if(openCells.length===0) return false;
  const openSet = new Set(openCells);
  const isBlocked = (r1,c1,r2,c2) => {
    let p1,p2;
    if(r1===r2){ const c = Math.max(c1,c2); p1={r:r1,c}; p2={r:r1+1,c}; }
    else { const r = Math.max(r1,r2); p1={r,c:c1}; p2={r,c:c1+1}; }
    const kind = candidateEdges[vertexEdgeKey(p1,p2)];
    return kind==='fence' || kind==='barricade';
  };
  const start = openCells[0];
  const visited = new Set([start]);
  const stack = [start];
  while(stack.length){
    const cur = stack.pop();
    const [r,c] = cur.split(',').map(Number);
    for(const [dr,dc] of [[0,1],[0,-1],[1,0],[-1,0]]){
      const nr=r+dr, nc=c+dc, nk=ck(nr,nc);
      if(!openSet.has(nk) || visited.has(nk)) continue;
      if(isBlocked(r,c,nr,nc)) continue;
      visited.add(nk); stack.push(nk);
    }
  }
  return visited.size !== openSet.size;
}

function handleEdgeClick(px,py){
  const v = nearestVertex(px,py,CELL);
  if(!pendingEdgeStart){
    pendingEdgeStart = v;
    render();
    return;
  }
  if(pendingEdgeStart.r===v.r && pendingEdgeStart.c===v.c){
    pendingEdgeStart = null;
    render();
    return;
  }
  if(!isAdjacentVertex(pendingEdgeStart, v)){
    toast('Точки должны быть смежными (в т.ч. по диагонали) — начинаю линию заново с этой точки', true);
    pendingEdgeStart = v;
    render();
    return;
  }
  const key = vertexEdgeKey(pendingEdgeStart, v);

  if(edgeTool === 'erase'){
    if(state.edges[key]){
      delete state.edges[key];
      saveState();
      toast('Сегмент удалён.');
    } else {
      toast('Здесь ничего не установлено.', true);
    }
    pendingEdgeStart = v;
    render();
    return;
  }

  if(state.edges[key] === edgeTool){
    // clicking the same tool on its own segment again is a quick "undo" for that one segment
    delete state.edges[key];
    saveState();
    pendingEdgeStart = v;
    render();
    toast('Сегмент убран.');
    return;
  }

  const errors = validateEdgeSegment(pendingEdgeStart, v, edgeTool);
  if(!errors.length && (edgeTool==='fence' || edgeTool==='barricade')){
    const candidate = Object.assign({}, state.edges, {[key]: edgeTool});
    if(wouldEncloseArea(candidate)){
      errors.push('Эта линия полностью отрежет часть территории от остальной — так по правилам нельзя (стр.11).');
    }
  }
  if(errors.length){
    toast('⚠ ' + errors[0], true);
    render();
    return;
  }

  state.edges[key] = edgeTool;
  saveState();
  pendingEdgeStart = v; // keep chaining so a whole fence line can be drawn click-by-click
  render();
}
function finishEdgeLine(){
  pendingEdgeStart = null;
  render();
}

/* ---- doors ---- */
function nearestEdge(px, py, cellSize){
  // px,py in grid pixel space (0..GRID*cellSize) — orthogonal cell-border snap, used for doors only
  const gx = px/cellSize, gy = py/cellSize;
  const rowF = Math.round(gy), colF = Math.round(gx);
  const distToHoriz = Math.abs(gy - rowF);
  const distToVert = Math.abs(gx - colF);
  if(distToHoriz < distToVert){
    const c = Math.max(0, Math.min(GRID-1, Math.floor(gx)));
    const r = Math.max(0, Math.min(GRID, rowF));
    return {type:'h', r, c};
  }else{
    const r = Math.max(0, Math.min(GRID-1, Math.floor(gy)));
    const c = Math.max(0, Math.min(GRID, colF));
    return {type:'v', r, c};
  }
}
function edgeKey(e){ return `${e.type}:${e.r}:${e.c}`; }

function edgeBelongsToStructureBoundary(e, structId){
  const s = state.structures[structId];
  if(!s) return false;
  const belongs = (r,c) => s.cells.some(([rr,cc])=>rr===r&&cc===c);
  if(e.type==='h'){
    const above = belongs(e.r-1, e.c);
    const below = belongs(e.r, e.c);
    return (above && !below) || (!above && below);
  }else{
    const left = belongs(e.r, e.c-1);
    const right = belongs(e.r, e.c);
    return (left && !right) || (!left && right);
  }
}
function toggleDoor(e){
  if(!selectedStructureId){ toast('Сначала выберите постройку для дверей', true); return; }
  if(!edgeBelongsToStructureBoundary(e, selectedStructureId)){
    toast('Дверь можно ставить только на границе выбранной постройки', true);
    return;
  }
  const s = state.structures[selectedStructureId];
  const key = edgeKey(e);
  const idx = s.doorEdges.indexOf(key);
  if(idx>=0){ s.doorEdges.splice(idx,1); }
  else{
    if(s.doors && s.doorEdges.length >= s.doors){
      toast(`У постройки #${s.id} уже отмечено заявленное число дверей (${s.doors}). Дверь всё равно добавлена — при желании увеличьте счётчик.`, true);
    }
    s.doorEdges.push(key);
  }
  saveState();
  render();
}

/* ---- connectors ---- */
function tryPlaceConnector(r,c){
  if(isOccupied(r,c) || connectorAt(r,c)){ toast('Клетка занята', true); return; }
  if(zoneOf(r,c) > state.landLevel){ toast('Вне открытой территории', true); return; }
  if(!connectorFirstCell){
    connectorFirstCell = [r,c];
    render();
    return;
  }
  const [fr,fc] = connectorFirstCell;
  const adjacent = (Math.abs(fr-r)+Math.abs(fc-c))===1;
  if(!adjacent){ toast('Вторая клетка должна быть соседней', true); connectorFirstCell=null; render(); return; }
  const id = state.nextConnId++;
  state.connectors.push({id, type: selectedConnectorType, cells:[[fr,fc],[r,c]], lowEnd:0});
  connectorFirstCell = null;
  saveState();
  render();
  toast(`${selectedConnectorType} добавлен(а).`);
}
function toggleConnectorOrientation(id){
  const cn = state.connectors.find(x=>x.id===id);
  if(!cn) return;
  cn.lowEnd = cn.lowEnd ? 0 : 1;
  saveState(); render();
}
function deleteConnector(id){
  state.connectors = state.connectors.filter(x=>x.id!==id);
  saveState(); render();
  toast('Коннектор удалён.');
}

/* ---- save / load JSON ---- */
function downloadJSON(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `homestead-settlement-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('JSON скачан.');
}

function loadJSONFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      state = Object.assign(
        {landLevel:1, cells:{}, structures:{}, nextId:1, edges:{}, connectors:[], nextConnId:1,
         squad:{members:{},nextMemberId:1}, warehouse:{nextInstId:1,items:{}},
         resources:{caps:0,resource:0}, editMode:false},
        parsed
      );
      draft = null; draftMeta = { structIndex:'', name:'', size:4, doors:1, small:false, parent:'' };
      selectedStructureId = null; inspectSelectedId = null; connectorFirstCell = null; pendingEdgeStart = null;
      edgeTool = 'fence';
      zoomScale = 1; panX = 0; panY = 0; // new plan may sit at a totally different spot on the grid —
      // keeping the old pan/zoom would leave the (correctly loaded) content scrolled out of view.
      state.edges = migrateEdges(state.edges || {});
      migrateSquadItems();
      saveState();
      render();
      toast('JSON загружен.');
    }catch(err){
      toast('Не удалось прочитать файл — это точно наш JSON?', true);
    }
  };
  reader.readAsText(file);
}

/* ---- print ---- */
function buildPrintSVG(){
  const ZONE_COLORS_PRINT = {1:'#eaf1fb', 2:'#fbf6df', 3:'#fdf0cf', 4:'#fbe6c0'};
  let svg = `<svg width="${SVG_SIZE}" height="${SVG_SIZE}" viewBox="0 0 ${SVG_SIZE} ${SVG_SIZE}" xmlns="http://www.w3.org/2000/svg">`;

  for(let r=0;r<GRID;r++){
    for(let c=0;c<GRID;c++){
      const zone = zoneOf(r,c);
      const structId = state.cells[ck(r,c)];
      let fill = ZONE_COLORS_PRINT[zone];
      if(structId) fill = state.structures[structId].color;
      svg += `<rect x="${c*CELL}" y="${r*CELL}" width="${CELL}" height="${CELL}" fill="${fill}" stroke="#8895a1" stroke-width="0.4"></rect>`;
      if(structId){
        const overlay = statusFillOverlay(state.structures[structId].status);
        if(overlay!=='none') svg += `<rect x="${c*CELL}" y="${r*CELL}" width="${CELL}" height="${CELL}" fill="${overlay}"></rect>`;
      }
    }
  }
  for(let r=0;r<=GRID;r++) for(let c=0;c<=GRID;c++) svg += `<circle cx="${c*CELL}" cy="${r*CELL}" r="0.8" fill="#333" opacity="0.35"></circle>`;

  for(const id in state.structures){
    const s = state.structures[id];
    const set = new Set(s.cells.map(([r,c])=>ck(r,c)));
    for(const [r,c] of s.cells){
      if(!set.has(ck(r-1,c))) svg += line(c*CELL,r*CELL,(c+1)*CELL,r*CELL,'#111',1.4);
      if(!set.has(ck(r+1,c))) svg += line(c*CELL,(r+1)*CELL,(c+1)*CELL,(r+1)*CELL,'#111',1.4);
      if(!set.has(ck(r,c-1))) svg += line(c*CELL,r*CELL,c*CELL,(r+1)*CELL,'#111',1.4);
      if(!set.has(ck(r,c+1))) svg += line((c+1)*CELL,r*CELL,(c+1)*CELL,(r+1)*CELL,'#111',1.4);
    }
  }

  for(const id in state.structures){
    const s = state.structures[id];
    const avgR = s.cells.reduce((a,[r])=>a+r,0)/s.cells.length;
    const avgC = s.cells.reduce((a,[,c])=>a+c,0)/s.cells.length;
    const cx = (avgC+0.5)*CELL, cy=(avgR+0.5)*CELL;
    svg += `<circle cx="${cx}" cy="${cy}" r="7" fill="#fff" stroke="#111" stroke-width="0.8"></circle>`;
    svg += `<text x="${cx}" y="${cy+3}" text-anchor="middle" font-size="9" font-family="monospace" fill="#111">${s.id}</text>`;
    const extra = (statusLetter(s.status) + (s.reinforced?' R':'')).trim();
    if(extra) svg += `<text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="7" font-family="monospace" fill="#a33">${extra}</text>`;
  }

  for(const id in state.structures){
    const s = state.structures[id];
    s.doorEdges.forEach(key=>{
      const [type,r,c] = key.split(':');
      const R=Number(r), C=Number(c);
      if(type==='h') svg += line(C*CELL,R*CELL,(C+1)*CELL,R*CELL,'#b8620a',3);
      else svg += line(C*CELL,R*CELL,C*CELL,(R+1)*CELL,'#b8620a',3);
    });
  }

  for(const key in state.edges){
    const [p1s,p2s] = key.split('|');
    const [r1,c1] = p1s.split(',').map(Number);
    const [r2,c2] = p2s.split(',').map(Number);
    const x1=c1*CELL, y1=r1*CELL, x2=c2*CELL, y2=r2*CELL;
    const kind = state.edges[key];
    const color = kind==='fence' ? '#2b6cb0' : kind==='barricade' ? '#c0392b' : '#a67c00';
    const dash = kind==='ladder' ? '2,2' : '';
    if(kind==='barricade'){
      const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
      const ox = -dy/len*1.5, oy = dx/len*1.5;
      svg += line(x1+ox,y1+oy,x2+ox,y2+oy,color,1.4,dash);
      svg += line(x1-ox,y1-oy,x2-ox,y2-oy,color,1.4,dash);
    }else{
      svg += line(x1,y1,x2,y2,color,1.6,dash);
    }
  }

  state.connectors.forEach(cn=>{
    const [[r1,c1],[r2,c2]] = cn.cells;
    const x = Math.min(c1,c2)*CELL, y = Math.min(r1,r2)*CELL;
    const w = (Math.abs(c1-c2)+1)*CELL, h = (Math.abs(r1-r2)+1)*CELL;
    svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#eeeeee" fill-opacity="0.6" stroke="#111" stroke-dasharray="3,2" stroke-width="1"></rect>`;
    const letter = cn.type==='Walkway' ? 'W' : cn.type==='Ramp' ? 'RP' : 'ST';
    svg += `<text x="${x+w/2}" y="${y+h/2+3}" text-anchor="middle" font-size="9" font-family="monospace" fill="#111">${letter}</text>`;
  });

  svg += `</svg>`;
  return svg;
}

function buildPrintTable(){
  const rows = Object.values(state.structures).sort((a,b)=>a.id-b.id).map(s => `
    <tr>
      <td>${s.id}</td><td>${s.name}</td><td>${s.cells.length}</td><td>${s.doorEdges.length}/${s.doors||0}</td>
      <td>${s.status}</td><td>${s.reinforced?'R':''}</td><td>${s.small?'да':''}</td><td>${s.parent||''}</td>
    </tr>`).join('');
  return `<table style="width:100%;border-collapse:collapse;font-family:'Courier New',monospace;font-size:11px;">
    <thead><tr style="background:#eee;">
      <th style="border:1px solid #999;padding:3px;">ID</th>
      <th style="border:1px solid #999;padding:3px;">Название</th>
      <th style="border:1px solid #999;padding:3px;">Размер</th>
      <th style="border:1px solid #999;padding:3px;">Двери</th>
      <th style="border:1px solid #999;padding:3px;">Статус</th>
      <th style="border:1px solid #999;padding:3px;">R</th>
      <th style="border:1px solid #999;padding:3px;">Small</th>
      <th style="border:1px solid #999;padding:3px;">Parent</th>
    </tr></thead>
    <tbody>${rows || '<tr><td colspan="8" style="padding:6px;">— построек пока нет —</td></tr>'}</tbody>
  </table>`;
}

/* ---- Squad roster print: shows the actual card art (unit/item/perk/mod) instead of a text
   list, the way the reference fwwsquadbuilder.netlify.app tool prints — laid out as one row per
   member with a grid of small item/perk cards next to their big unit card, so you can read it at
   a glance during a game. Reuses the same UNIT_CARD_BY_NAME/ITEM_CARD_BY_NAME/PERK_CARD_BY_NAME
   lookups the on-screen 🃏 buttons use; an entry with no matching art just falls back to its
   name in a dashed placeholder box instead of breaking the layout. ---- */
function printCardImgHtml(name, cardMap, cls){
  const val = cardMap[name];
  const files = val ? (Array.isArray(val) ? val : [val]) : [];
  if(!files.length) return `<div class="${cls} p-noimg">${name}</div>`;
  return files.map(f=>`<img class="${cls}" src="${new URL('cards-web/'+encodeURIComponent(f), location.href).href}" title="${name}">`).join('');
}
// Item/perk/mod cards sit in a fixed 8-per-row grid (see .p-items-grid) — each gets wrapped in a
// same-size box so a landscape perk card and a portrait item card still occupy identical grid
// cells; printCardImgHtml above stays as-is for the big unit portrait, which doesn't need that.
function printCardBoxHtml(name, cardMap){
  const val = cardMap[name];
  const files = val ? (Array.isArray(val) ? val : [val]) : [];
  if(!files.length) return `<div class="p-item-box p-noimg">${name}</div>`;
  return files.map(f=>`<div class="p-item-box"><img class="p-item-img" src="${new URL('cards-web/'+encodeURIComponent(f), location.href).href}" title="${name}"></div>`).join('');
}
function buildPrintSquadHtml(){
  const members = Object.values(state.squad.members).filter(m=>m.mission);
  if(!members.length) return '<p>Нет бойцов с отметкой «Миссия».</p>';
  return members.map(m=>{
    const unit = (m.unitIdx!==null && m.unitIdx!==undefined) ? UNITS_DB[m.unitIdx] : null;
    const unitName = unit ? unit[1] : '?';
    const heldItems = itemsHeldBy(m.id).filter(inst=>!isModIdx(inst.itemIdx));
    const memberModSlot = unitModTypeForIdx(m.unitIdx);
    const isDog = isDogUnitIdx(m.unitIdx);
    const hidePerks = !!memberModSlot || isDog;
    const innatePerks = unit && unit[3] ? unit[3] : [];

    const unitImgHtml = printCardImgHtml(unitName, isAutomatronHeadIdx(m.unitIdx) ? AUTOMATRON_HEAD_CARD_BY_NAME : UNIT_CARD_BY_NAME, 'p-unit-img');
    let autoHtml = '';
    if(isAutomatronHeadIdx(m.unitIdx)){
      if(m.automatronTorso) autoHtml += printCardImgHtml(m.automatronTorso, AUTOMATRON_TORSO_CARD_BY_NAME, 'p-unit-img');
      if(m.automatronLegs) autoHtml += printCardImgHtml(m.automatronLegs, AUTOMATRON_LEGS_CARD_BY_NAME, 'p-unit-img');
    }

    const badges = [];
    if(m.poisoned) badges.push('<span class="p-badge p-badge-bad">Poisoned</span>');
    if(m.injuredArm) badges.push('<span class="p-badge p-badge-bad">Inj. Arm</span>');
    if(m.injuredLeg) badges.push('<span class="p-badge p-badge-bad">Inj. Leg</span>');
    if(m.damage > 0) badges.push(`<span class="p-badge">Damage: ${m.damage}</span>`);
    if(m.radiation > 0) badges.push(`<span class="p-badge">Radiation: ${m.radiation}</span>`);
    const badgesHtml = badges.length ? `<div class="p-badges">${badges.join('')}</div>` : '';

    // Same order as the builder: Heroic/Clunky/Wild -> Leader Perk -> Perks -> Items (a mod
    // immediately follows the item it's attached to, same as it reads on-screen).
    let cardsHtml = '';
    if(m.heroic && !isDog){
      const heroicName = memberModSlot==='Robot Mod' ? 'Clunky' : memberModSlot==='Creature Mod' ? 'Wild' : 'Heroic';
      cardsHtml += printCardBoxHtml(heroicName, HEROIC_CARD_BY_NAME);
    }
    if(m.leader && m.leaderPerk!==null && m.leaderPerk!==undefined && LEADER_PERKS_DB[m.leaderPerk]){
      cardsHtml += printCardBoxHtml(LEADER_PERKS_DB[m.leaderPerk][0], LEADER_PERK_CARD_BY_NAME);
    }
    if(!hidePerks){
      cardsHtml += [...innatePerks, ...m.perks].map(pidx=>{
        const p = PERKS_DB[pidx];
        return p ? printCardBoxHtml(p[0], PERK_CARD_BY_NAME) : '';
      }).join('');
    }
    cardsHtml += heldItems.map(inst=>{
      const it = ITEMS_DB[inst.itemIdx];
      if(!it) return '';
      let html = printCardBoxHtml(it[2], ITEM_CARD_BY_NAME);
      if(inst.modInstId){
        const modInst = state.warehouse.items[inst.modInstId];
        const modIt = modInst ? ITEMS_DB[modInst.itemIdx] : null;
        if(modIt) html += printCardBoxHtml(modIt[2], ITEM_CARD_BY_NAME);
      }
      return html;
    }).join('');
    // Robot/Creature "unit mods" (memberModSlot) are a separate slot from item-attached mods
    // above — see "Моды юнита" in the builder — but still just ITEMS_DB entries under the hood.
    if(memberModSlot){
      cardsHtml += (m.mods||[]).map(modId=>{
        const modInst = state.warehouse.items[modId];
        const modIt = modInst ? ITEMS_DB[modInst.itemIdx] : null;
        return modIt ? printCardBoxHtml(modIt[2], ITEM_CARD_BY_NAME) : '';
      }).join('');
    }

    return `<div class="p-unit">
      <div class="p-unit-name">#${m.id} ${m.name ? m.name+' — ' : ''}${unitName}${m.leader?' ★ Leader':''}${m.mission?' ⚑':''}</div>
      ${badgesHtml}
      <div class="p-unit-row">
        <div class="p-unit-imgcol">${unitImgHtml}${autoHtml}</div>
        <div class="p-items-grid">${cardsHtml || '<span class="p-hint">нет предметов/перков</span>'}</div>
      </div>
    </div>`;
  }).join('');
}

  const win = window.open('', '_blank');

  win.document.write(`
    <!DOCTYPE html><html><head><meta charset="utf-8"><title>Squad Roster — печать</title>
    <style>
      @page{ size:a4 landscape; margin:8mm; }
      body{ font-family:'Courier New', monospace; padding:0; color:#111; background:#fff; }

      .p-badges{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:5px; }

/* ---- reset ---- */
function resetAll(){
  if(!confirm('Точно очистить весь Layout? Это действие необратимо. (Отряд/ростер/склад/ресурсы не затрагиваются.)')) return;
  state = {landLevel: state.landLevel, cells:{}, structures:{}, nextId:1, edges:{}, connectors:[], nextConnId:1,
    squad: state.squad, warehouse: state.warehouse, resources: state.resources, editMode: state.editMode};
  draft=null; draftMeta = { structIndex:'', name:'', size:4, doors:1, small:false, parent:'' };
  selectedStructureId=null; inspectSelectedId=null; connectorFirstCell=null; pendingEdgeStart=null;
  edgeTool='fence';
  zoomScale = 1; panX = 0; panY = 0;
  saveState();
  render();
}

const CELL = 18;
const SVG_SIZE = GRID*CELL;

function renderSidebar(){
  const sb = document.getElementById('sidebar');

  const modeBtn = (key,label) => `<button data-mode="${key}" class="${mode===key?'active':''}">${label}</button>`;

  let html = `
  <fieldset>
    <legend>РЕЖИМ</legend>
    <div class="mode-btns">
      ${modeBtn('draw','▣ Рисовать постройку')}
      ${modeBtn('doors','▢ Двери')}
      ${modeBtn('edges','╱ Заборы / Барикады / Лестницы')}
      ${modeBtn('connectors','▤ Walkway / Ramp / Staircase')}
      ${modeBtn('inspect','◎ Осмотр / Статус')}
    </div>
  </fieldset>

  <fieldset>
    <legend>LAND</legend>
    <label>Открытый уровень территории</label>
    <select id="landLevelSel">
      ${[1,2,3,4].map(l=>{
        const diff = l - state.landLevel;
        const cost = diff > 0 ? diff * LAND_COST_PER_LEVEL : 0;
        // Per the book, Land purchases aren't reversible — once bought, the territory can't be
        // shrunk back down. Only global editMode (free-form editing) allows going backwards.
        const blocked = diff < 0 && !state.editMode;
        const afford = state.editMode || cost <= state.resources.caps;
        const enabled = afford && !blocked;
        const costLabel = cost > 0 ? ` — ${cost} крышек` : '';
        const reason = blocked ? ' (нельзя уменьшить)' : (!afford ? ' (не хватает)' : '');
        return `<option value="${l}" ${state.landLevel===l?'selected':''} ${enabled?'':'disabled'}>${l} — ${ZONE_NAMES[l]}${costLabel}${reason}</option>`;
      }).join('')}
    </select>
    <div class="hint">Затемнённые клетки — территория, которую вы ещё не выкупили (Land Structure).
      Расширение стоит ${LAND_COST_PER_LEVEL} крышек за уровень (стр.4 книги) и списывается сразу
      при выборе; уменьшить уровень нельзя (Land не продаётся обратно), кроме режима
      редактирования, где территорию можно двигать в обе стороны бесплатно.</div>
  </fieldset>

  <fieldset>
    <legend>РЕСУРСЫ</legend>
    <div class="row">
      <div><label>Крышки</label><input type="number" min="0" id="capsInput" value="${state.resources.caps}"></div>
      <div><label>Ресурс (макс. ${computeMaxResource()})</label><input type="number" min="0" max="${computeMaxResource()}" id="resourceInput" value="${state.resources.resource}"></div>
    </div>
    <div class="row">
      <div><label>Энергия</label><div class="resource-readout">⚡ ${computeEnergy()}</div></div>
      <div><label>Вода</label><div class="resource-readout">💧 ${computeWater()}</div></div>
    </div>
    <div class="hint">Лимит Ресурса = 2× суммарной площади всех Resource Shed (стр.4-5 книги:
      "discard any Resources in excess of the maximum... held by their Resource Sheds"); без
      единого Resource Shed хранить Ресурс нельзя.</div>
    <div class="hint">Энергия и Вода считаются автоматически по построенным Generator/Water
      Pump/Water Purifier (стр.6-7 книги) — вручную не редактируются.</div>
    <div class="hint">"Режим редактирования" — общий переключатель наверху экрана (действует на все
      вкладки): пока включён, постройка/расширение территории/ремонт брони бесплатны и без
      ограничений.</div>
  </fieldset>
  `;

  if(mode==='draw'){
    const locked = draftMeta.structIndex !== '';
    const selCount = draft ? draft.cells.size : 0;
    html += `
    <fieldset>
      <legend>НОВАЯ ПОСТРОЙКА</legend>
      <label>Тип постройки (из книги правил)</label>
      <select id="structTypeSel">${buildStructTypeOptions(draftMeta.structIndex)}</select>
      <div class="hint" id="structInfoHint">${locked ? `Параметры зафиксированы по книге правил.${(()=>{const it=STRUCTURES_DB[Number(draftMeta.structIndex)];return it?` Cost: ${it.cost}${it.notes?' · '+it.notes:''}`:'';})()}` : '★ = Small Structure. Или заполните поля вручную ниже для кастомной/расширенной постройки (Extension).'}</div>

      <input type="text" id="inpName" value="${draftMeta.name.replace(/"/g,'&quot;')}" placeholder="напр. Hut, Resource Shed..." ${locked?'readonly':''}>

        <div><label>Дверей</label><input type="number" id="inpDoors" min="0" max="4" value="${draftMeta.doors}" ${locked?'readonly':''}></div>
      </div>
      <label><input type="checkbox" id="inpSmall" ${draftMeta.small?'checked':''} ${locked?'disabled':''}> Small Structure (без мин. дистанции)</label>

        if(!draftMeta.small){

        }

            : 'Нет подходящих построек-контейнеров на плане (нужен построенный Hut/Shelter/Lodge' + (cat==='Boost'?' или Barracks':'') + ').';

        <button id="btnCancel" class="ghost" ${draft?'':'disabled'}>Отмена</button>
      </div>
      ${draft ? `<div class="hint">Выделено клеток: <b>${selCount}${draftMeta.size?(' / '+draftMeta.size):''}</b>. Кликайте по клеткам поля, чтобы включать/выключать их в форме.</div>` : `<div class="hint">Нажмите "Начать выделение", затем кликайте по клеткам поля.</div>`}
      <div class="hint">Проверка формы автоматическая: размеры 1/2/4/6 обязаны быть точным прямоугольником (1x1/2x1/2x2/3x2, можно повернуть), 8+ — любая цельная форма шириной не менее 2 клеток.</div>
      <div id="validationBox"></div>

  }

  if(mode==='doors'){
    const opts = Object.values(state.structures).map(s=>`<option value="${s.id}" ${selectedStructureId==s.id?'selected':''}>#${s.id} ${s.name} (${s.doorEdges.length}/${s.doors||0} дверей)</option>`).join('');
    html += `
    <fieldset>
      <legend>ДВЕРИ</legend>

    <fieldset>

      <div class="mode-btns">
        ${edgeToolBtn('fence','╱ Fence','#79addc')}
        ${edgeToolBtn('barricade','▤ Barricade','#ff9b85')}
        ${edgeToolBtn('ladder','▥ Ladder','#ffd670')}
        ${edgeToolBtn('erase','✕ Удалить','#ff5d5d')}
      </div>
      <label style="margin-top:8px;">2. Кликайте по точкам сетки</label>
      <div class="hint">Клик — начало линии, клик по соседней точке (в т.ч. по диагонали) — ставится сегмент выбранного типа. Клик тем же инструментом по уже стоящему сегменту — убирает его. Линия продолжается от новой точки, так удобно тянуть длинный забор в несколько кликов. Чтобы стереть сегмент — выберите инструмент "✕ Удалить" и кликните по его двум точкам.</div>
      <button id="btnFinishLine" class="ghost" ${pendingEdgeStart?'':'disabled'}>Завершить линию</button>
      <div class="small-note">Авто-проверка по правилам (стр.10-11): не внутри построек, не перекрывает двери, угол в точке касания (со стеной постройки, с другим забором/барикадой — правило одно и то же) может быть только 0°(прямо)/90°/135°, угол 45° запрещён всегда, диагональ у угла постройки может уходить прочь от угла (135° к обеим стенам), но не идти вдоль одной из стен (45° к ней), зазор Orange (2 клетки) — от построек и от других (не соединённых) заборов/барикад, нельзя полностью изолировать участок территории (проверяется для контуров из прямых/ортогональных сегментов; контуры целиком из диагоналей проверяйте вручную). Лестница обязана примыкать к постройке/Walkway/Ramp и не может быть диагональной.</div>

    </fieldset>`;

  if(mode==='inspect'){
    const s = inspectSelectedId ? state.structures[inspectSelectedId] : null;
    if(s){
      html += `
      <fieldset>
        <legend>#${s.id} — ${s.name}</legend>

        <select id="statusSel">
          ${['Undamaged','Damaged','Badly Damaged','Wrecked'].map(v=>`<option ${s.status===v?'selected':''}>${v}</option>`).join('')}

        <label><input type="checkbox" id="reinforcedChk" ${s.reinforced?'checked':''}> Reinforced (R)</label>
        <div class="hint">Размер: ${s.cells.length} | Дверей размечено: ${s.doorEdges.length}/${s.doors||0} | Small: ${s.small?'да':'нет'}${s.parent?(' | Внутри: #'+s.parent+(state.structures[s.parent]?(' '+state.structures[s.parent].name):' (постройка удалена)')):''}</div>

    }else{
      html += `<fieldset><legend>ОСМОТР</legend><div class="hint">Кликните по постройке на плане, чтобы посмотреть и изменить её статус.</div></fieldset>`;
    }
  }

  // Structures log
  const rows = Object.values(state.structures).sort((a,b)=>a.id-b.id).map(s=>`
    <tr class="${inspectSelectedId===s.id?'sel':''}">
      <td><span class="swatch" style="background:${s.color}"></span>${s.id}</td>

      <td>${s.status==='Undamaged'?'—':s.status}</td>
      <td>${s.reinforced?'R':''}</td>
    </tr>`).join('');
  html += `
  <fieldset>
    <legend>STRUCTURES LOG (${Object.keys(state.structures).length})</legend>
    <table class="log" id="structLogTable">
      <tr><th></th><th>Name</th><th>Size</th><th>Status</th><th>R</th></tr>
      ${rows || '<tr><td colspan=5 style="color:#5b8f70">пусто</td></tr>'}
    </table>
  </fieldset>

  <fieldset>
    <legend>ЛЕГЕНДА ЗОН</legend>
