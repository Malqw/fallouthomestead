  sb.innerHTML = html;
  attachSidebarEvents();
}

function attachSidebarEvents(){
  document.querySelectorAll('[data-mode]').forEach(b=>{
    b.onclick = ()=>{ mode = b.dataset.mode; draft=null; connectorFirstCell=null; pendingEdgeStart=null; render(); };
  });
  const ll = document.getElementById('landLevelSel');
  if(ll) ll.onchange = e=>{
    const newLevel = Number(e.target.value);
    const diff = newLevel - state.landLevel;
    if(diff < 0 && !state.editMode){
      toast('Территорию нельзя уменьшить — по правилам Land не продаётся обратно (кроме режима редактирования).', true);
      render();
      return;
    }
    if(diff > 0){
      const cost = diff * LAND_COST_PER_LEVEL;
      if(!state.editMode && cost > state.resources.caps){
        toast(`Не хватает крышек на расширение территории: нужно ${cost}, в наличии ${state.resources.caps}.`, true);
        render(); // re-render reverts the <select> to the still-unchanged state.landLevel
        return;
      }
      if(!state.editMode){
        state.resources.caps -= cost;
        toast(`Территория расширена до уровня ${newLevel} (−${cost} крышек).`);
      } else {
        toast(`Территория расширена до уровня ${newLevel} (бесплатно, режим редактирования).`);
      }
    }
    state.landLevel = newLevel;
    saveState();
    render();
  };

  // Caps/Resource: persist on every keystroke without a full rerender (a rebuilt input would
  // steal focus after one character — same fix as the Squad tab's typed fields), then rerender
  // on blur so the structure dropdown's afford/disabled state catches up to the new balance.
  const capsInput = document.getElementById('capsInput');
  if(capsInput){
    capsInput.oninput = e=>{ state.resources.caps = Math.max(0, Number(e.target.value)||0); saveState(); };
    capsInput.onblur = ()=> render();
  }
  const resourceInput = document.getElementById('resourceInput');
  if(resourceInput){
    resourceInput.oninput = e=>{
      const max = computeMaxResource();
      state.resources.resource = Math.max(0, Math.min(Number(e.target.value)||0, max));
      saveState();
    };
    resourceInput.onblur = ()=> render();
  }
  const btnStart = document.getElementById('btnStart');
  if(btnStart) btnStart.onclick = startDraft;
  const btnSave = document.getElementById('btnSave');
  if(btnSave) btnSave.onclick = saveDraft;
  const btnCancel = document.getElementById('btnCancel');
  if(btnCancel) btnCancel.onclick = cancelDraft;

  const structSel = document.getElementById('structTypeSel');
  if(structSel) structSel.onchange = e=>{
    draftMeta.structIndex = e.target.value;
    if(e.target.value !== ''){
      const item = STRUCTURES_DB[Number(e.target.value)];
      draftMeta.name = item.name;
      draftMeta.size = item.size;
      draftMeta.doors = item.doors;
      draftMeta.small = !!item.small;
    }
    draftMeta.parent = ''; // eligible containers depend on the type/category — reset the choice
    render();
  };
  const inpName = document.getElementById('inpName');
  if(inpName) inpName.oninput = e=> draftMeta.name = e.target.value;
  const inpSize = document.getElementById('inpSize');
  if(inpSize) inpSize.oninput = e=> draftMeta.size = Number(e.target.value)||0;
  const inpDoors = document.getElementById('inpDoors');
  if(inpDoors) inpDoors.oninput = e=> draftMeta.doors = Number(e.target.value)||0;
  const inpSmall = document.getElementById('inpSmall');
  if(inpSmall) inpSmall.onchange = e=>{ draftMeta.small = e.target.checked; draftMeta.parent = ''; render(); };
  const inpParent = document.getElementById('inpParent');
  if(inpParent) inpParent.onchange = e=> draftMeta.parent = e.target.value;

  const doorSel = document.getElementById('doorStructSel');
  if(doorSel) doorSel.onchange = e=>{ selectedStructureId = e.target.value?Number(e.target.value):null; render(); };

  const connSel = document.getElementById('connTypeSel');
  if(connSel) connSel.onchange = e=>{ selectedConnectorType = e.target.value; };

  const statusSel = document.getElementById('statusSel');
  if(statusSel) statusSel.onchange = e=> updateStructureField(inspectSelectedId,'status', e.target.value);
  const reinforcedChk = document.getElementById('reinforcedChk');
  if(reinforcedChk) reinforcedChk.onchange = e=> updateStructureField(inspectSelectedId,'reinforced', e.target.checked);
  const btnDeleteStruct = document.getElementById('btnDeleteStruct');
  if(btnDeleteStruct) btnDeleteStruct.onclick = ()=> deleteStructure(inspectSelectedId);

  const btnReset = document.getElementById('btnReset');
  if(btnReset) btnReset.onclick = resetAll;

  const btnSaveJson = document.getElementById('btnSaveJson');
  if(btnSaveJson) btnSaveJson.onclick = downloadJSON;
  const btnLoadJson = document.getElementById('btnLoadJson');
  const fileLoadJson = document.getElementById('fileLoadJson');
  if(btnLoadJson && fileLoadJson){
    btnLoadJson.onclick = ()=> fileLoadJson.click();
    fileLoadJson.onchange = (e)=>{
      if(e.target.files && e.target.files[0]) loadJSONFile(e.target.files[0]);
      e.target.value = '';
    };
  }
  const btnPrint = document.getElementById('btnPrint');
  if(btnPrint) btnPrint.onclick = printLayout;

  const btnFinishLine = document.getElementById('btnFinishLine');
  if(btnFinishLine) btnFinishLine.onclick = finishEdgeLine;

  document.querySelectorAll('[data-edgetool]').forEach(b=>{
    b.onclick = ()=>{ edgeTool = b.dataset.edgetool; pendingEdgeStart=null; render(); };
  });

  document.querySelectorAll('#structLogTable tr').forEach(tr=>{
    tr.style.cursor='pointer';
    tr.onclick = ()=>{
      const idText = tr.querySelector('td')?.textContent?.trim();
      const id = Number(idText);
      if(id){ mode='inspect'; inspectSelectedId=id; render(); }
    };
  });
}

function statusFillOverlay(status){
  switch(status){
    case 'Damaged': return 'rgba(255,180,80,0.35)';
    case 'Badly Damaged': return 'rgba(255,110,60,0.5)';
    case 'Wrecked': return 'rgba(60,60,60,0.75)';
    default: return 'none';
  }
}
function statusLetter(status){
  return {'Damaged':'D','Badly Damaged':'BD','Wrecked':'W'}[status] || '';
}

function renderStage(){
  const stage = document.getElementById('stageInner');
  let svg = `<svg width="${SVG_SIZE+2}" height="${SVG_SIZE+2}" viewBox="0 0 ${SVG_SIZE} ${SVG_SIZE}">`;

  // cells
  for(let r=0;r<GRID;r++){
    for(let c=0;c<GRID;c++){
      const zone = zoneOf(r,c);
      const locked = zone > state.landLevel;
      const structId = state.cells[ck(r,c)];
      const inDraft = draft && draft.cells.has(ck(r,c));
      let fill = ZONE_COLORS[zone];
      if(structId){ fill = state.structures[structId].color; }
      if(inDraft){ fill = '#3ce080'; }
      svg += `<rect class="cell ${locked&&!structId&&!inDraft?'locked':''}" data-r="${r}" data-c="${c}"
        x="${c*CELL}" y="${r*CELL}" width="${CELL}" height="${CELL}" fill="${fill}"
        stroke="#0006" stroke-width="0.5"></rect>`;
      // status overlay
      if(structId){
        const s = state.structures[structId];
        const overlay = statusFillOverlay(s.status);
        if(overlay!=='none'){
          svg += `<rect x="${c*CELL}" y="${r*CELL}" width="${CELL}" height="${CELL}" fill="${overlay}" pointer-events="none"></rect>`;
        }
      }
    }
  }

  // dots grid (subtle, on top of fills, under structures outline emphasis)
  for(let r=0;r<=GRID;r++){
    for(let c=0;c<=GRID;c++){
      svg += `<circle cx="${c*CELL}" cy="${r*CELL}" r="1" fill="#ffffff" opacity="0.15" pointer-events="none"></circle>`;
    }
  }

  // structure outlines (thicker border around each structure's outer boundary)
  for(const id in state.structures){
    const s = state.structures[id];
    const set = new Set(s.cells.map(([r,c])=>ck(r,c)));
    for(const [r,c] of s.cells){
      // top
      if(!set.has(ck(r-1,c))) svg += line(c*CELL,r*CELL,(c+1)*CELL,r*CELL,'#04140b',1.6);
      if(!set.has(ck(r+1,c))) svg += line(c*CELL,(r+1)*CELL,(c+1)*CELL,(r+1)*CELL,'#04140b',1.6);
      if(!set.has(ck(r,c-1))) svg += line(c*CELL,r*CELL,c*CELL,(r+1)*CELL,'#04140b',1.6);
      if(!set.has(ck(r,c+1))) svg += line((c+1)*CELL,r*CELL,(c+1)*CELL,(r+1)*CELL,'#04140b',1.6);
    }
  }

  // draft outline
  if(draft){
    for(const key of draft.cells){
      const [r,c] = key.split(',').map(Number);
      if(!draft.cells.has(ck(r-1,c))) svg += line(c*CELL,r*CELL,(c+1)*CELL,r*CELL,'#ffffff',1.4);
      if(!draft.cells.has(ck(r+1,c))) svg += line(c*CELL,(r+1)*CELL,(c+1)*CELL,(r+1)*CELL,'#ffffff',1.4);
      if(!draft.cells.has(ck(r,c-1))) svg += line(c*CELL,r*CELL,c*CELL,(r+1)*CELL,'#ffffff',1.4);
      if(!draft.cells.has(ck(r,c+1))) svg += line((c+1)*CELL,r*CELL,(c+1)*CELL,(r+1)*CELL,'#ffffff',1.4);
    }
  }

  // structure ID + status labels (at centroid)
  for(const id in state.structures){
    const s = state.structures[id];
    const avgR = s.cells.reduce((a,[r])=>a+r,0)/s.cells.length;
    const avgC = s.cells.reduce((a,[,c])=>a+c,0)/s.cells.length;
    const cx = (avgC+0.5)*CELL, cy=(avgR+0.5)*CELL;
    svg += `<circle cx="${cx}" cy="${cy}" r="7" fill="#04140b" stroke="#fff" stroke-width="0.6" pointer-events="none"></circle>`;
    svg += `<text class="lbl idlbl" x="${cx}" y="${cy+3}" text-anchor="middle" fill="#fff">${s.id}</text>`;
    const extra = (statusLetter(s.status) + (s.reinforced?' R':'')).trim();
    if(extra){
      svg += `<text class="lbl statlbl" x="${cx}" y="${cy+13}" text-anchor="middle" fill="#ffdede" pointer-events="none">${extra}</text>`;
    }
  }

  // doors
  for(const id in state.structures){
    const s = state.structures[id];
    s.doorEdges.forEach(key=>{
      const [type,r,c] = key.split(':');
      const R=Number(r), C=Number(c);
      if(type==='h') svg += line(C*CELL,R*CELL,(C+1)*CELL,R*CELL,'#ffb454',3);
      else svg += line(C*CELL,R*CELL,C*CELL,(R+1)*CELL,'#ffb454',3);
    });
  }

  // fences/barricades/ladders (vertex-to-vertex, may be diagonal)
  for(const key in state.edges){
    const [p1s,p2s] = key.split('|');
    const [r1,c1] = p1s.split(',').map(Number);
    const [r2,c2] = p2s.split(',').map(Number);
    const x1=c1*CELL, y1=r1*CELL, x2=c2*CELL, y2=r2*CELL;
    const kind = state.edges[key];
    const color = kind==='fence' ? '#79addc' : kind==='barricade' ? '#ff9b85' : '#ffd670';
    const dash = kind==='ladder' ? '2,2' : '';
    if(kind==='barricade'){
      const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
      const ox = -dy/len*1.6, oy = dx/len*1.6;
      svg += line(x1+ox,y1+oy,x2+ox,y2+oy,color,1.8,dash);
      svg += line(x1-ox,y1-oy,x2-ox,y2-oy,color,1.8,dash);
    }else{
      svg += line(x1,y1,x2,y2,color,2.2,dash);
    }
  }

  // pending edge start marker (edges mode, mid-line)
  if(mode==='edges' && pendingEdgeStart){
    const {r,c} = pendingEdgeStart;
    svg += `<circle cx="${c*CELL}" cy="${r*CELL}" r="4.5" fill="none" stroke="#fff" stroke-width="1.6" pointer-events="none"></circle>`;
  }

  // connectors
  state.connectors.forEach(cn=>{
    const [[r1,c1],[r2,c2]] = cn.cells;
    const x = Math.min(c1,c2)*CELL, y=Math.min(r1,r2)*CELL;
    const w = (Math.abs(c1-c2)+1)*CELL, h=(Math.abs(r1-r2)+1)*CELL;
    svg += `<rect data-conn="${cn.id}" x="${x}" y="${y}" width="${w}" height="${h}" fill="#0006c022" fill-opacity="0.3" stroke="#ffffff" stroke-dasharray="3,2" stroke-width="1"></rect>`;
    const letter = cn.type==='Walkway'?'W':cn.type==='Ramp'?'RP':'ST';
    svg += `<text class="lbl" x="${x+w/2}" y="${y+h/2+3}" text-anchor="middle" fill="#fff" font-size="9" pointer-events="none">${letter}</text>`;
    if(cn.type!=='Walkway'){
      const lowX = cn.lowEnd===0 ? x+6 : x+w-6;
      svg += `<polygon points="${lowX-4},${y+h-4} ${lowX+4},${y+h-4} ${lowX},${y+h-10}" fill="#fff" pointer-events="none"></polygon>`;
    }
  });

  // click catcher (transparent, top layer) — only intercepts clicks in doors/edges mode,
  // otherwise pointer-events is off so clicks pass through to the cells/connectors below
  // (fill="transparent" still registers hits in most browsers unless pointer-events is set)
  const catcherActive = (mode==='edges' || mode==='doors');
  svg += `<rect id="catcher" x="0" y="0" width="${SVG_SIZE}" height="${SVG_SIZE}" fill="transparent" pointer-events="${catcherActive?'auto':'none'}"></rect>`;

  svg += `</svg>`;
  stage.innerHTML = svg;
  attachStageEvents();
  applyStageTransform();
}

function line(x1,y1,x2,y2,color,width,dash){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:''} pointer-events="none"></line>`;
}

function attachStageEvents(){
  const svgEl = document.querySelector('#stage svg');
  if(!svgEl) return;

  if(mode==='draw'){
    svgEl.querySelectorAll('.cell').forEach(rect=>{
      rect.onclick = ()=>{
        if(!draft){ toast('Нажмите "Начать выделение"', true); return; }
        toggleDraftCell(Number(rect.dataset.r), Number(rect.dataset.c));
        render();
      };
    });
  }

  if(mode==='inspect'){
    svgEl.querySelectorAll('.cell').forEach(rect=>{
      rect.onclick = ()=>{
        const r=Number(rect.dataset.r), c=Number(rect.dataset.c);
        const id = state.cells[ck(r,c)];
        if(id){ inspectSelectedId = id; render(); }
      };
    });
  }

  if(mode==='connectors'){
    svgEl.querySelectorAll('.cell').forEach(rect=>{
      rect.onclick = ()=>{
        tryPlaceConnector(Number(rect.dataset.r), Number(rect.dataset.c));
      };
    });
    svgEl.querySelectorAll('[data-conn]').forEach(el=>{
      el.style.cursor='pointer';
      el.onclick = (ev)=>{ ev.stopPropagation(); toggleConnectorOrientation(Number(el.dataset.conn)); };
      el.ondblclick = (ev)=>{ ev.stopPropagation(); deleteConnector(Number(el.dataset.conn)); };
    });
  }

  if(mode==='edges'){
    const catcher = document.getElementById('catcher');
    catcher.style.cursor='crosshair';
    catcher.onclick = (ev)=>{
      const rect = svgEl.getBoundingClientRect();
      const scale = SVG_SIZE / rect.width;
      const px = (ev.clientX-rect.left)*scale;
      const py = (ev.clientY-rect.top)*scale;
      handleEdgeClick(px,py);
    };
  }

  if(mode==='doors'){
    const catcher = document.getElementById('catcher');
    catcher.style.cursor='crosshair';
    catcher.onclick = (ev)=>{
      const rect = svgEl.getBoundingClientRect();
      const scale = SVG_SIZE / rect.width;
      const px = (ev.clientX-rect.left)*scale;
      const py = (ev.clientY-rect.top)*scale;
      const e = nearestEdge(px,py,CELL);
      toggleDoor(e);
    };
  }
}

function render(){
  const layoutEl = document.getElementById('layoutView');
  const squadEl = document.getElementById('squadView');
  const warehouseEl = document.getElementById('warehouseView');
  if(layoutEl) layoutEl.style.display = view==='layout' ? 'flex' : 'none';
  if(squadEl) squadEl.style.display = view==='squad' ? 'block' : 'none';
  if(warehouseEl) warehouseEl.style.display = view==='warehouse' ? 'block' : 'none';
  document.getElementById('viewLayoutBtn')?.classList.toggle('active', view==='layout');
  document.getElementById('viewSquadBtn')?.classList.toggle('active', view==='squad');
  document.getElementById('viewWarehouseBtn')?.classList.toggle('active', view==='warehouse');
  // The top bar is static markup (not rebuilt by render()), so just sync the checkbox's own
  // state/color here instead of regenerating it.
  const editToggle = document.getElementById('globalEditModeToggle');
  if(editToggle) editToggle.checked = !!state.editMode;
  const editLabel = document.getElementById('globalEditModeLabel');
  if(editLabel) editLabel.style.color = state.editMode ? 'var(--amber)' : 'var(--green-dim)';

  if(view==='layout'){
    renderSidebar();
    renderStage();
  } else if(view==='squad'){
    renderSquadView();
  } else if(view==='warehouse'){
    renderWarehouseView();
  }
}

function renderSquadView(){
  const wrap = document.getElementById('squadView');
  if(!wrap) return;
  const members = Object.values(state.squad.members).sort((a,b)=>a.id-b.id);
  const totalCaps = members.reduce((s,m)=>s+capsForMember(m), 0);
  const missionMembers = members.filter(m=>m.mission);
  const missionCaps = missionMembers.reduce((s,m)=>s+capsForMember(m), 0);

  const squadFactions = [...new Set(UNITS_DB.map((u,i)=>({u,i})).filter(x=>!HIDDEN_UNIT_INDICES.has(x.i)).map(x=>x.u[0]))];
  let html = `
  <div class="squad-toolbar">
    <div class="combo" style="min-width:200px;">
      <select id="squadFactionSelect">
        <option value="">— любая фракция —</option>
        ${squadFactions.map(f=>`<option value="${f}" ${state.squad.faction===f?'selected':''}>${f}</option>`).join('')}
      </select>
    </div>
    <div class="combo" style="flex:1 1 240px; min-width:220px;">
      <select class="combo-native combo-enhance" data-combo-mode="action" data-combo-placeholder="+ Добавить бойца — выбрать юнита…" id="addMemberUnitSelect">${unitOptionsHtml(null, state.squad.faction)}</select>
    </div>
    <span class="squad-total">Бойцов: ${members.length} · Caps отряда: ${totalCaps}</span>
    <span class="squad-total mission-total">На миссию: ${missionMembers.length} · Caps: ${missionCaps}</span>
    <div class="squad-more" style="position:relative;">
      <button id="btnSquadMore" type="button">⋮ Действия</button>
      <div class="squad-more-menu" id="squadMoreMenu">
        <button id="btnSaveJsonSquad">⭳ Скачать JSON</button>
        <button id="btnLoadJsonSquad">⭱ Загрузить JSON</button>
        <input type="file" id="fileLoadJsonSquad" accept="application/json" style="display:none">
        <button id="btnExportWW" style="display:none" title="Открыть отряд в фанатском билдере achapin.github.io/wastelandworkshop (для печати карточек)">⇗ Wasteland Workshop</button>
        <button id="btnPrintSquad" title="Печатная раскладка ростера: карточки юнитов и предметов вместо текста">🖨 Печать состава</button>
        <button class="danger" id="btnClearSquad">Очистить ростер</button>
      </div>
    </div>
  </div>
  <div class="squad-grid">
  `;

  if(members.length===0){
    html += `<div class="hint">Ростер пуст. Нажмите "+ Добавить бойца".</div>`;
  }

  members.forEach(m=>{

function attachSquadEvents(){
  const wrap = document.getElementById('squadView');
  if(!wrap) return;

  const squadFactionSelect = document.getElementById('squadFactionSelect');
  if(squadFactionSelect) squadFactionSelect.onchange = (e)=>{
    state.squad.faction = e.target.value;
    saveState();
    render();
  };
  const addMemberUnitSelect = document.getElementById('addMemberUnitSelect');
  if(addMemberUnitSelect) addMemberUnitSelect.onchange = (e)=>{
    const val = e.target.value;
    if(val === '') return;
    addSquadMemberWithUnit(Number(val));
  };

  const btnExportWW = document.getElementById('btnExportWW');
  if(btnExportWW) btnExportWW.onclick = openInWastelandWorkshop;
  const btnPrintSquad = document.getElementById('btnPrintSquad');
  if(btnPrintSquad) btnPrintSquad.onclick = printSquadRoster;

  const btnClear = document.getElementById('btnClearSquad');
  if(btnClear) btnClear.onclick = ()=>{
    if(!confirm('Точно очистить весь ростер отряда? Это действие необратимо. (Предметы бойцов вернутся на склад.)')) return;
    Object.values(state.warehouse.items).forEach(inst=>{
      if(inst.holder !== 'warehouse') inst.holder = 'warehouse';
    });
    state.squad = { members: {}, nextMemberId: 1, faction: '' };
    saveState();
    render();
  };

  const btnSaveJsonSquad = document.getElementById('btnSaveJsonSquad');
  if(btnSaveJsonSquad) btnSaveJsonSquad.onclick = downloadJSON;
  const btnLoadJsonSquad = document.getElementById('btnLoadJsonSquad');
  const fileLoadJsonSquad = document.getElementById('fileLoadJsonSquad');
  if(btnLoadJsonSquad && fileLoadJsonSquad){
    btnLoadJsonSquad.onclick = ()=> fileLoadJsonSquad.click();
    fileLoadJsonSquad.onchange = (e)=>{
      if(e.target.files && e.target.files[0]) loadJSONFile(e.target.files[0]);
      e.target.value = '';
    };
  }

  const btnSquadMore = document.getElementById('btnSquadMore');
  const squadMoreMenu = document.getElementById('squadMoreMenu');
  if(btnSquadMore && squadMoreMenu){
    btnSquadMore.onclick = ()=> squadMoreMenu.classList.toggle('open');
    squadMoreMenu.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=> squadMoreMenu.classList.remove('open'));
    });
  }

  wrap.querySelectorAll('[data-field]').forEach(el=>{
    const id = Number(el.dataset.member);
    const field = el.dataset.field;
    const isTyped = el.type==='text' || el.type==='number';
    const handler = (e)=>{
      if(field==='leader'){ setSquadLeader(id); return; }
      let val;
      if(el.type==='checkbox') val = e.target.checked;
      else if(el.type==='number') val = Number(e.target.value)||0;
      else if(field==='leaderPerk') val = e.target.value===''? null : Number(e.target.value);
      else val = e.target.value;
      // typed fields: persist without a full rerender, or a rebuilt DOM node steals focus
      // after every single keystroke (see the "Миссия"/#6 fix). Selects/checkboxes always
      // rerender since they can change what other cards' dropdowns/legend/caps show.
      updateSquadMember(id, field, val, !isTyped);
    };
    if(isTyped){
      el.oninput = handler;
      el.onblur = ()=> render();
    } else {
      el.onchange = handler;
    }
  });

  wrap.querySelectorAll('[data-addperk]').forEach(sel=>{
    sel.onchange = (e)=>{ addPerkToMember(Number(sel.dataset.addperk), e.target.value); };
  });
  wrap.querySelectorAll('[data-additem]').forEach(sel=>{
    sel.onchange = (e)=>{
      const val = e.target.value;
      if(val === '') return;
      const memberId = Number(sel.dataset.additem);
      if(val.startsWith('new:')) createItemForMember(memberId, Number(val.slice(4)));
      else assignItemToMember(Number(val), memberId);
    };
  });
  wrap.querySelectorAll('[data-removeperk]').forEach(b=>{
    b.onclick = ()=> removePerkFromMember(Number(b.dataset.removeperk), Number(b.dataset.pos));
  });
  wrap.querySelectorAll('[data-removeitem]').forEach(b=>{
    b.onclick = ()=> returnItemToWarehouse(Number(b.dataset.removeitem));
  });
  wrap.querySelectorAll('[data-addmembermod]').forEach(sel=>{
    sel.onchange = (e)=>{
      const val = e.target.value;
      if(val === '') return;
      attachMemberModValue(Number(sel.dataset.addmembermod), val);
    };
  });
  wrap.querySelectorAll('[data-detachmembermod]').forEach(b=>{
    b.onclick = ()=> detachMemberMod(Number(b.dataset.detachmembermod), Number(b.dataset.modinst));
  });
  wrap.querySelectorAll('[data-delmember]').forEach(b=>{
    b.onclick = ()=>{ if(confirm('Удалить этого бойца из ростера? Его предметы вернутся на склад.')) deleteSquadMember(Number(b.dataset.delmember)); };
  });
  attachArmorControls(wrap);
  enhanceCombos(wrap);
}

/* ============================= STAGE ZOOM / PAN ============================= */
// Keeps the field usable on touch: pinch with two fingers to zoom, drag with one
// finger (or mouse) to pan, mouse wheel to zoom on desktop. A tap that doesn't move
// still reaches the underlying cell's own onclick as before; a real drag/pinch
// suppresses the click that would otherwise follow, so it never toggles a cell by accident.
function applyStageTransform(){
  const inner = document.getElementById('stageInner');
  if(inner) inner.style.transform = `translate(${panX}px,${panY}px) scale(${zoomScale})`;
}
function setZoom(newZoom, anchorClientX, anchorClientY){
  const stageEl = document.getElementById('stage');
  const rect = stageEl.getBoundingClientRect();
  const ax = (anchorClientX!==undefined ? anchorClientX-rect.left : rect.width/2);
  const ay = (anchorClientY!==undefined ? anchorClientY-rect.top : rect.height/2);
  const clamped = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, newZoom));
  panX = ax - (ax-panX) * (clamped/zoomScale);
  panY = ay - (ay-panY) * (clamped/zoomScale);
  zoomScale = clamped;
  applyStageTransform();
}

function setupStageGestures(){
  const stageEl = document.getElementById('stage');
  if(!stageEl) return;
  const pointers = new Map(); // pointerId -> {x,y}
  let dragStart = null;       // {x,y,panX,panY} for single-pointer pan
  let pinchStartDist = null, pinchStartMid = null, pinchStartZoom = null;
  let moved = false;
  let suppressClick = false;

  const dist = (a,b)=> Math.hypot(a.x-b.x, a.y-b.y);
  const mid = (a,b)=> ({x:(a.x+b.x)/2, y:(a.y+b.y)/2});

  function onMove(ev){
    if(!pointers.has(ev.pointerId)) return;
    pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    if(pointers.size>=2){
      const vals = [...pointers.values()];
      const a=vals[0], b=vals[1];
      const d = dist(a,b), m = mid(a,b);
      if(pinchStartDist){
        const newZoom = pinchStartZoom * (d/pinchStartDist);
        setZoom(newZoom, m.x, m.y);
        moved = true;
      }
      ev.preventDefault();
    } else if(dragStart){
      const dx = ev.clientX-dragStart.x, dy = ev.clientY-dragStart.y;
      if(!moved && Math.hypot(dx,dy) > 6) moved = true;
      if(moved){
        panX = dragStart.panX + dx;
        panY = dragStart.panY + dy;
        applyStageTransform();
        ev.preventDefault();
      }
    }
  }
  function onUp(ev){
    pointers.delete(ev.pointerId);
    if(moved) suppressClick = true;
    if(pointers.size < 2){ pinchStartDist=null; pinchStartMid=null; }
    if(pointers.size === 1){
      const [p] = pointers.values();
      dragStart = {x:p.x, y:p.y, panX, panY};
      moved = false;
    }
    if(pointers.size === 0){
      dragStart = null; moved = false;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    }
  }

  stageEl.addEventListener('pointerdown', (ev)=>{
    const wasEmpty = pointers.size===0;
    pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    if(pointers.size===1){
      dragStart = {x:ev.clientX, y:ev.clientY, panX, panY};
      moved = false;
    } else if(pointers.size===2){
      const vals = [...pointers.values()];
      pinchStartDist = dist(vals[0], vals[1]);
      pinchStartMid = mid(vals[0], vals[1]);
      pinchStartZoom = zoomScale;
    }
    if(wasEmpty){
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }
  });

  // Swallow the click that follows a real drag/pinch (capture phase runs before the
  // individual cell's own onclick, which is attached in the bubble phase).
  stageEl.addEventListener('click', (ev)=>{
    if(suppressClick){ ev.stopPropagation(); suppressClick=false; }
  }, true);

  // Desktop: mouse wheel zooms toward the cursor.
  stageEl.addEventListener('wheel', (ev)=>{
    ev.preventDefault();
    const factor = ev.deltaY < 0 ? 1.12 : 1/1.12;
    setZoom(zoomScale*factor, ev.clientX, ev.clientY);
  }, {passive:false});

  const btnIn = document.getElementById('btnZoomIn');
  const btnOut = document.getElementById('btnZoomOut');
  const btnReset = document.getElementById('btnZoomReset');
  if(btnIn) btnIn.onclick = ()=> setZoom(zoomScale*1.25);
  if(btnOut) btnOut.onclick = ()=> setZoom(zoomScale/1.25);
  if(btnReset) btnReset.onclick = ()=>{ zoomScale=1; panX=0; panY=0; applyStageTransform(); };
}

tle": "Pete Thomas - Sit and Dream"}, {"file": "Presidental - Inon Zur.mp3", "title": "Presidental - Inon Zur"}, {"file": "Roy Brown - Mighty Mighty Man .mp3", "title": "Roy Brown - Mighty Mighty Man "}, {"file": "The Ink Spots - It's a Sin to Tell a Lie.mp3", "title": "The Ink Spots - It's a Sin to Tell a Lie"}, {"file": "The Roues Brothers - I'm Movin' Out.mp3", "title": "The Roues Brothers - I'm Movin' Out"}, {"file": "The Wanderer.mp3", "title": "The Wanderer"}, {"file": "Way Back Home.mp3", "title": "Way Back Home"}];
let musicTracks = [];
let musicIndex = 0;
let musicVolume = 0.6;
const musicAudio = new Audio();
musicAudio.preload = 'none';

// iOS Safari hard-ignores audio.volume by design (it wants the hardware buttons to be the only
// volume control) — the slider looks like it does nothing there. Routing playback through a
// WebAudio GainNode instead works around that on every platform, iOS included. Falls back to
// plain audio.volume if WebAudio isn't available at all. Must be created after a user gesture
// (autoplay policy), so this is lazily set up from toggleMusicPlay() rather than at load time.
let musicAudioCtx = null, musicGainNode = null;
function ensureMusicAudioGraph(){
  if(musicAudioCtx) return;
  try{
    musicAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = musicAudioCtx.createMediaElementSource(musicAudio);
    musicGainNode = musicAudioCtx.createGain();
    musicGainNode.gain.value = musicVolume;
    source.connect(musicGainNode).connect(musicAudioCtx.destination);
  }catch(e){ musicAudioCtx = null; musicGainNode = null; }
}
function setMusicVolume(v){
  musicVolume = v;
  if(musicGainNode) musicGainNode.gain.value = v; else musicAudio.volume = v;
  localStorage.setItem('homestead-music-volume', String(v));
}

function updateMusicUI(){
  const nameEl = document.getElementById('musicTrackName');
  const playBtn = document.getElementById('musicPlayBtn');
  if(!nameEl || !playBtn) return;
  if(!musicTracks.length){
    nameEl.textContent = 'Нет треков';
    playBtn.disabled = true;
    return;
  }
  playBtn.disabled = false;
  nameEl.textContent = musicTracks[musicIndex].title;
  playBtn.textContent = musicAudio.paused ? '▶' : '⏸';
}
function loadMusicTrack(i, autoplay){
  if(!musicTracks.length) return;
  musicIndex = ((i % musicTracks.length) + musicTracks.length) % musicTracks.length;
  musicAudio.src = 'music/' + encodeURIComponent(musicTracks[musicIndex].file);
  localStorage.setItem('homestead-music-index', String(musicIndex));
  if(autoplay) musicAudio.play().catch(()=>{});
  updateMusicUI();
}
function toggleMusicPlay(){
  if(!musicTracks.length) return;
  ensureMusicAudioGraph();
  if(musicAudioCtx && musicAudioCtx.state === 'suspended') musicAudioCtx.resume();
  if(!musicAudio.src){ loadMusicTrack(musicIndex, true); return; }
  if(musicAudio.paused) musicAudio.play().catch(()=>{}); else musicAudio.pause();
}
function musicNext(){ loadMusicTrack(musicIndex + 1, true); }
function musicPrev(){ loadMusicTrack(musicIndex - 1, true); }
musicAudio.addEventListener('play', updateMusicUI);
musicAudio.addEventListener('pause', updateMusicUI);
musicAudio.addEventListener('ended', musicNext);

function initMusicPlayer(){
  const savedVol = localStorage.getItem('homestead-music-volume');
  musicVolume = savedVol !== null ? Number(savedVol) : 0.6;
  musicAudio.volume = musicVolume; // harmless baseline; the GainNode (once created) is what actually rules once playback starts
  const volSlider = document.getElementById('musicVolume');
  if(volSlider) volSlider.value = Math.round(musicVolume * 100);
  musicTracks = MUSIC_TRACKS;
  const savedIndex = Number(localStorage.getItem('homestead-music-index'));
  if(Number.isInteger(savedIndex) && savedIndex >= 0 && savedIndex < musicTracks.length) musicIndex = savedIndex;
  updateMusicUI();
}

/* ============================= INIT ============================= */
(async function init(){
  await loadState();
  const viewSwitchMenu = document.getElementById('viewSwitchMenu');
  document.querySelectorAll('[data-view]').forEach(b=>{
    b.onclick = ()=>{ view = b.dataset.view; render(); viewSwitchMenu?.classList.remove('open'); };
  });
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  if(hamburgerBtn && viewSwitchMenu) hamburgerBtn.onclick = ()=> viewSwitchMenu.classList.toggle('open');
  const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
  const sidebarEl = document.getElementById('sidebar');
  if(sidebarToggleBtn && sidebarEl) sidebarToggleBtn.onclick = ()=>{
    const open = sidebarEl.classList.toggle('open');
    sidebarToggleBtn.textContent = open ? '▼ Скрыть панель' : '▲ Панель управления';
  };
  const globalEditModeToggle = document.getElementById('globalEditModeToggle');
  if(globalEditModeToggle) globalEditModeToggle.onchange = e=>{
    state.editMode = e.target.checked;
    saveState();
    render();
  };
  const musicBtn = document.getElementById('musicBtn');
  const musicPanel = document.getElementById('musicPanel');
  if(musicBtn && musicPanel) musicBtn.onclick = ()=> musicPanel.classList.toggle('open');
  document.getElementById('musicPlayBtn')?.addEventListener('click', toggleMusicPlay);
  document.getElementById('musicPrevBtn')?.addEventListener('click', musicPrev);
  document.getElementById('musicNextBtn')?.addEventListener('click', musicNext);
  document.getElementById('musicVolume')?.addEventListener('input', e=>{
    setMusicVolume(Number(e.target.value) / 100);
  });
  initMusicPlayer();
  // Card art lightbox: one delegated listener covers every 🃏 button ever rendered (squad cards,
  // warehouse stock, perks) without re-wiring after each render() call. The <img> elements are
  // only created here, on click, so browsing the roster never downloads art nobody asked to see.
  // A combo entry (e.g. "Frank Horrigan I+II") carries several '|'-separated paths and just shows
  // each mini's card side by side instead of picking one.
  const cardLightbox = document.getElementById('cardLightbox');
  const cardLightboxImages = document.getElementById('cardLightboxImages');
  document.body.addEventListener('click', e=>{
    const btn = e.target.closest('.card-btn');
    if(btn && cardLightbox && cardLightboxImages){
      const paths = btn.dataset.cards.split('|');
      cardLightboxImages.innerHTML = paths.map(p=>`<img src="${p}" alt="">`).join('');
      cardLightboxImages.classList.toggle('multi', paths.length > 1);
      cardLightbox.classList.add('open');
      return;
    }
    if(e.target.closest('#cardLightbox')){
      cardLightbox.classList.remove('open');
      cardLightboxImages.innerHTML = '';
    }
  });
  render();
  setupStageGestures();
})();
</script>
